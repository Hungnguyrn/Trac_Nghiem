<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<!-- Markmap (d3 + markmap-view) chỉ được tải khi mở Mind map lần đầu -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  --bg: #090909;
  --paper: #141414;
  --ink: #f5f5f5;
  --muted: #a3a3a3;
  --line: #303030;

  --accent: #f5f5f5;
  --accent-ink: #090909;
  --accent-soft: rgba(255, 255, 255, 0.075);

  --ok: #f5f5f5;
  --ok-soft: rgba(255, 255, 255, 0.09);
  --bad: #a3a3a3;
  --bad-soft: rgba(255, 255, 255, 0.035);
  --flag: #d4d4d4;
  --flag-soft: rgba(255, 255, 255, 0.08);

  --code-bg: #050505;
  --code-ink: #eeeeee;
  --grid: rgba(255,255,255,.018);

  --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;font-family:var(--sans);font-size:16px;line-height:1.55;color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-top:0}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.brand{background:none;border:0;font-weight:700;letter-spacing:.2px;padding:6px 8px;margin-left:-8px;border-radius:8px}
.brand:hover{background:var(--accent-soft)}
.prog{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.prog span{font-size:13px;color:var(--muted);white-space:nowrap}
.timer{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;padding:4px 10px;border:1px solid var(--line);border-radius:8px}
.timer.warn{color:var(--bad);border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:10px;font-weight:500;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.navtoggle{display:none}

main{max-width:1120px;margin:0 auto;padding:20px 16px 48px}

/* start */
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(30px,5.2vw,50px);line-height:1.08;margin:0 0 14px;font-weight:700;letter-spacing:-.8px}
.wave{display:block;width:min(100%,430px);height:auto;margin:6px 0 18px;color:var(--accent)}
.lede{max-width:60ch;color:var(--muted);margin:0 0 26px;font-size:17px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 12px;font-weight:600}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{position:relative;display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.mode input{position:absolute;opacity:0;inset:0;cursor:pointer}
.mode b{display:block;margin-bottom:2px}
.mode span{font-size:14px;color:var(--muted)}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mode:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:180px}
.field label,.field .lab{font-size:13px;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px}
.check{display:flex;gap:10px;align-items:center;cursor:pointer;min-height:36px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.start{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px}
.start .btn.primary{padding:12px 26px;font-size:17px;min-height:48px}
.hint{font-size:13px;color:var(--muted)}
.resume{border-color:var(--accent);background:var(--accent-soft)}
.resume p{margin:0 0 12px}

/* test layout */
.test{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;max-height:calc(100dvh - 100px);overflow:auto}
.side-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.side-h .x{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.grid button{position:relative;height:38px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-size:13px;font-variant-numeric:tabular-nums;padding:0}
.grid button.done{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.grid button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.grid button.cur{outline:3px solid var(--ink);outline-offset:1px}
.grid button.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--flag);border:2px solid var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px;margin-right:5px}
.legend .l-done{background:var(--accent-soft);border-color:var(--accent)}
.legend .l-ok{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-bad{background:var(--bad-soft);border-color:var(--bad)}
.legend .l-flag{background:var(--flag);border-color:var(--flag);border-radius:50%}
.kbd{margin-top:14px;font-size:12.5px;color:var(--muted)}
.kbd kbd{font-family:var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 10px;margin-bottom:6px}
.qno{font-size:22px;font-weight:700;letter-spacing:-.3px}
.qno small{font-size:14px;font-weight:500;color:var(--muted);margin-left:2px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);align-self:center}
.chip.st-ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chip.st-bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.chip.st-na{color:var(--flag);border-color:var(--flag);background:var(--flag-soft)}
.group{font-size:13px;color:var(--muted);margin:0 0 16px}
.stem{font-size:18px;font-weight:500;line-height:1.5;margin:0 0 14px;max-width:72ch}
.stem.sub{font-weight:400}
.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:13.5px;line-height:1.55;padding:14px 16px;border-radius:10px;overflow-x:auto;margin:0 0 14px;white-space:pre;tab-size:4}
.code code{font-family:inherit}
.fig{margin:0 0 14px}
.fig img{display:block;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt .let{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;margin-top:-1px}
.opt .otxt{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .let{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .let{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[data-static]{pointer-events:none}
.tag{flex:none;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:2px}
.tag.ok{color:var(--ok);border:1px solid var(--ok)}
.tag.bad{color:var(--bad);border:1px solid var(--bad)}
.fb{margin:14px 0 0;padding:10px 14px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.actions{position:sticky;bottom:0;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:8px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.flagbtn.on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag);font-weight:600}
.flagbtn::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--flag);margin-right:8px}

/* result */
.res-hero{padding:18px 0 6px}
.res-hero h1{font-size:clamp(26px,4vw,38px);margin:0 0 4px;letter-spacing:-.5px}
.big{font-size:clamp(56px,11vw,104px);font-weight:700;line-height:1;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.big small{font-size:.38em;color:var(--muted);letter-spacing:-1px;font-weight:500}
.sub2{color:var(--muted);margin:6px 0 18px}
.seg{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line);margin:6px 0 10px}
.seg i{display:block;height:100%}
.seg .s-ok{background:var(--ok)} .seg .s-bad{background:var(--bad)} .seg .s-na{background:var(--line)}
.counts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px}
.counts b{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.na{background:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.brk{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px 12px;align-items:center;font-size:14.5px}
.brk .nm small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.brk .tr{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.brk .tr i{display:block;height:100%;background:var(--accent)}
.brk .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px}
.fchip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 14px;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.revlist{display:flex;flex-direction:column;gap:16px}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}

/* modal */
.scrim2{position:fixed;inset:0;background:rgba(10,15,22,.55);z-index:50;display:grid;place-items:center;padding:16px}
.dlg{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:440px;width:100%}
.dlg h3{margin:0 0 10px;font-size:20px}
.dlg p{margin:0 0 8px}
.dlg .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
.scrim{display:none}

@media (max-width:900px){
  .test{grid-template-columns:minmax(0,1fr)}
  .navtoggle{display:inline-flex;align-items:center}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:16px 16px 0 0;max-height:72dvh;transform:translateY(105%);transition:transform .22s;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,15,22,.5);z-index:35}
  .side-h .x{display:inline-flex}
  .prog span{display:none}
}
@media (max-width:640px){
  .modes,.two{grid-template-columns:1fr}
  .card{padding:16px}
  .stem{font-size:17px}
  .top-in{gap:8px;padding:8px 12px}
  .btn{padding:8px 11px}
  .brand{display:none}
  .actions .btn{padding:8px 10px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* External quiz file and question metadata */
.eyebrow{margin:0 0 8px;color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.file-input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px;max-width:100%;min-height:42px}
.error-text{color:var(--bad)!important}
.quiz-context{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
.question-level{display:inline-block;margin:0 0 14px;padding:4px 10px;border:1px solid var(--accent);border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:13px}
.explanation{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.explanation strong{display:block;margin-bottom:4px}
.explanation p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:640px){.file-input{width:100%}}



/* ===== Tinh chỉnh hiệu ứng ===== */
html{color-scheme:dark}
.btn i,.timer-w i{font-size:1.1em;vertical-align:-.15em}
.timer-w{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.flagbtn::before{display:none}
.opt{transition:border-color .2s,background .2s,transform .2s,box-shadow .2s}
.opt:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 12px rgba(99,102,241,.1)}
.opt:active{transform:scale(.99)}
.opt.ok .let,.opt.bad .let{color:#09090b}
.grid button{border:none;background:var(--line);border-radius:8px;transition:background .2s,transform .15s}
.grid button.cur{outline:2px solid var(--accent);outline-offset:2px}
.big{color:var(--accent);text-shadow:0 0 20px rgba(99,102,241,.4)}
.bar>i{transition:width .45s cubic-bezier(.2,.8,.2,1)}
.seg i,.brk .tr i{transition:width .7s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hero,.panel,.card,.fb,.explanation{animation:rise .32s ease both}
.card.still{animation:none}
.opt.ok{animation:pop .3s ease}
.opt.bad{animation:shake .35s ease}
.dlg{animation:pop .2s ease}
.big{animation:pop .5s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}


/* ===== Minimal monochrome UI polish ===== */
:root { color-scheme: dark; }
html { scroll-behavior: smooth; }
body {
  background-image:
    radial-gradient(ellipse at 50% -18%, rgba(255,255,255,.055), transparent 58%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: auto, 28px 28px, 28px 28px;
}
::selection { background: #e5e5e5; color: #090909; }
:focus-visible { outline: 2px solid #f5f5f5; outline-offset: 3px; }
.top {
  background: rgba(15,15,15,.92);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}
.top-in { gap: 10px; }
.brand { max-width: 28%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand:hover { background: rgba(255,255,255,.07); }
.bar { height: 5px; background: #303030; }
.bar>i { background: #f5f5f5; }
.timer { border-radius: 999px; background: #101010; }
.timer.warn { color: #f5f5f5; border-color: #f5f5f5; }
.btn {
  background: #171717;
  border-color: #363636;
  border-radius: 999px;
  transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
}
.btn:hover { border-color: #a3a3a3; background: #222; }
.btn:active { transform: translateY(1px) scale(.985); }
.btn.primary {
  color: #090909;
  background: #f5f5f5;
  border-color: #f5f5f5;
}
.btn.primary:hover { background: #dcdcdc; border-color: #dcdcdc; filter: none; }
main { padding-top: clamp(20px, 4vw, 38px); }
.hero { padding-top: clamp(20px, 4vw, 42px); }
.hero h1 { letter-spacing: -1.5px; max-width: 18ch; }
.wave { color: #d4d4d4; opacity: .8; height: 24px; }
.eyebrow { letter-spacing: .14em; font-size: 11px; }
.lede { font-size: 15px; max-width: 58ch; line-height: 1.8; }
.panel, .card, .side {
  background: rgba(20,20,20,.94);
  border-color: #303030;
  border-radius: 18px;
  box-shadow: 0 12px 36px rgba(0,0,0,.12);
}
.panel { padding: clamp(16px, 2.5vw, 24px); }
.panel h2 {
  display: flex; align-items: center; gap: 9px;
  font-size: 14px; letter-spacing: .01em;
}
.panel h2 i { font-size: 17px; color: #a3a3a3; }
.mode {
  border-color: #303030;
  border-radius: 14px;
  background: #111;
  transition: background .2s ease, border-color .2s ease, transform .2s ease;
}
.mode:hover { border-color: #666; transform: translateY(-1px); }
.mode:has(input:checked) { border-color: #f5f5f5; background: rgba(255,255,255,.055); }
.mode b { font-size: 15px; }
.mode span { display: block; line-height: 1.65; margin-top: 4px; }
select, .file-input {
  background: #0c0c0c;
  border-color: #363636;
  border-radius: 11px;
}
select:focus, .file-input:focus { border-color: #bdbdbd; }
.check input { accent-color: #f5f5f5; }
.resume { border-color: #555; background: rgba(255,255,255,.04); }
.test { gap: 18px; }
.side { background: rgba(17,17,17,.97); }
.grid { grid-template-columns: repeat(auto-fill,minmax(36px,1fr)); gap: 7px; }
.grid button {
  border: 1px solid #303030;
  background: #101010;
  color: #bdbdbd;
  border-radius: 10px;
}
.grid button:hover { border-color: #a3a3a3; color: #fff; transform: translateY(-1px); }
.grid button.done { background: #2a2a2a; border-color: #737373; color: #f5f5f5; }
.grid button.ok { background: #f5f5f5; border-color: #f5f5f5; color: #090909; }
.grid button.bad { background: #202020; border-color: #777; color: #c4c4c4; text-decoration: underline; text-decoration-style: dotted; }
.grid button.cur { outline: 2px solid #f5f5f5; outline-offset: 2px; }
.grid button.flag::after { background: #f5f5f5; border-color: #111; }
.legend .l-done, .legend .l-ok, .legend .l-bad, .legend .l-flag { background: #777; border-color: #aaa; }
.legend .l-ok { background: #f5f5f5; border-color: #f5f5f5; }
.legend .l-bad { background: #333; border-color: #aaa; }
.legend .l-flag { background: #a3a3a3; border-color: #a3a3a3; }
.kbd kbd { background: #111; }
.card { padding: clamp(17px, 3vw, 28px); }
.qno { letter-spacing: -.6px; }
.question-level { border-color: #555; background: #222; color: #ddd; }
.chip.st-ok, .chip.st-bad, .chip.st-na {
  color: #e5e5e5; border-color: #555; background: #222;
}
.stem { line-height: 1.72; }
.opt {
  border-color: #333;
  background: #111;
  border-radius: 14px;
  padding: 14px 15px;
}
.opt:hover { border-color: #858585; transform: translateY(-1px); box-shadow: 0 7px 18px rgba(0,0,0,.2); }
.opt .let { background: #191919; border-color: #414141; color: #ddd; border-radius: 9px; }
.opt.sel { border-color: #eee; background: rgba(255,255,255,.07); }
.opt.sel .let { background: #f5f5f5; border-color: #f5f5f5; color: #090909; }
.opt.ok { border-color: #22c55e; background: rgba(34,197,94,.14); }
.opt.ok .let { background: #22c55e; border-color: #22c55e; color: #07140b; }
.opt.bad { border-color: #ef4444; background: rgba(239,68,68,.13); }
.opt.bad .let { background: #ef4444; border-color: #ef4444; color: #200707; }
.tag.ok { color: #86efac; border-color: rgba(34,197,94,.55); background: rgba(34,197,94,.12); }
.tag.bad { color: #fca5a5; border-color: rgba(239,68,68,.55); background: rgba(239,68,68,.12); }
.fb.ok { color: #bbf7d0; background: rgba(34,197,94,.11); border: 1px solid rgba(34,197,94,.45); }
.fb.bad { color: #fecaca; background: rgba(239,68,68,.11); border: 1px solid rgba(239,68,68,.45); }
.flagbtn.on { background: #252525; border-color: #aaa; color: #fff; }
.flagbtn::before { background: #a3a3a3; }
.actions { background: linear-gradient(to top, var(--bg) 72%, transparent); }
.res-hero { padding-top: 24px; }
.res-hero h1 { letter-spacing: -1px; }
.big { color: #f5f5f5; text-shadow: none; }
.seg .s-ok { background: #f5f5f5; }
.seg .s-bad { background: #777; }
.seg .s-na { background: #303030; }
.dot.ok, .dot.bad, .dot.na { background: #f5f5f5; }
.dot.bad { background: #777; }
.dot.na { background: #303030; border: 1px solid #777; }
.brk .tr i { background: #bdbdbd; }
.fchip { background: #151515; border-radius: 999px; }
.fchip[aria-pressed="true"] { background: #f5f5f5; color: #090909; border-color: #f5f5f5; }
.explanation { background: #0c0c0c; border-color: #333; }
.dlg { background: #151515; border-color: #444; box-shadow: 0 24px 80px rgba(0,0,0,.5); }
.scrim2 { background: rgba(0,0,0,.72); backdrop-filter: blur(5px); }
.empty { border-color: #444; }
.btn i, .timer-w i { font-size: 1.05em; }
@keyframes fadeUpSoft { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
.hero, .panel, .card, .res-hero { animation: fadeUpSoft .28s ease both; }
.panel:nth-of-type(2) { animation-delay: .035s; }
.panel:nth-of-type(3) { animation-delay: .07s; }
@media (max-width: 640px) {
  main { padding: 16px 12px calc(28px + env(safe-area-inset-bottom,0px)); }
  .hero h1 { font-size: clamp(30px, 9vw, 42px); }
  .top-in { gap: 6px; }
  .top .btn { min-height: 36px; padding: 7px 10px; font-size: 12px; }
  .timer { padding: 4px 8px; font-size: 12px; }
  .panel, .card { border-radius: 15px; }
  .side { border-radius: 18px 18px 0 0; }
  .actions { gap: 7px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}


/* ===== Hiệu ứng chạm: bỏ ô xanh mặc định của Android ===== */
*,*::before,*::after{-webkit-tap-highlight-color:transparent}
.check{padding:4px 10px;margin:0 -10px;border-radius:12px;transition:background .15s ease,transform .12s ease}
.check:active{background:rgba(255,255,255,.07);transform:scale(.985)}
.mode:active,.fchip:active,.grid button:active{transform:scale(.97)}
.mode,.fchip{transition:background .2s ease,border-color .2s ease,transform .12s ease}

/* ===== Dải A B C D thay cho sóng vuông ===== */
.abcd{display:flex;gap:10px;margin:8px 0 22px}
.abcd span{width:44px;height:44px;display:grid;place-items:center;border:1.5px solid #3a3a3a;border-radius:13px;background:#111;color:var(--muted);font-weight:600;font-size:15px;animation:abIn .4s ease var(--d) both}
.abcd span.on{background:#f5f5f5;border-color:#f5f5f5;color:#090909;animation:abIn .4s ease var(--d) both,abPulse 1.6s ease-out .9s 2}
@keyframes abIn{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
@keyframes abPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}


/* ===== Bố cục mới: bắt đầu, làm bài, kết quả (giữ giao diện đơn sắc) ===== */
#view.start-view,
#view.result-view,
#view.test-view { min-width: 0; }

/* Màn hình bắt đầu: phần mở đầu gọn, cấu hình chia cột theo nhóm chức năng */
body[data-view="start"] main {
  max-width: 1180px;
  padding-top: clamp(18px, 3vw, 30px);
}
#view.start-view {
  display: grid;
  grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
  align-items: start;
  gap: 16px;
}
#view.start-view > .start-hero,
#view.start-view > .resume,
#view.start-view > .start-actions { grid-column: 1 / -1; }
#view.start-view > .start-hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "eyebrow letters" "title letters" "desc letters";
  column-gap: clamp(20px, 5vw, 64px);
  align-items: center;
  padding: clamp(12px, 2vw, 22px) 0 18px;
  margin: 0;
}
#view.start-view .start-hero .eyebrow { grid-area: eyebrow; margin-bottom: 7px; }
#view.start-view .start-hero h1 { grid-area: title; max-width: 24ch; font-size: clamp(30px, 4vw, 46px); margin-bottom: 10px; }
#view.start-view .start-hero .abcd { grid-area: letters; align-self: center; justify-self: end; gap: 9px; margin: 0; }
#view.start-view .start-hero .abcd span { width: clamp(38px, 4vw, 48px); height: clamp(38px, 4vw, 48px); border-radius: 12px; }
#view.start-view .start-hero .lede { grid-area: desc; margin: 0; max-width: 64ch; }
#view.start-view > .panel { min-width: 0; margin: 0; }
#view.start-view .start-modes { grid-column: 1; }
#view.start-view .start-options { grid-column: 2; grid-row: span 2; }
#view.start-view .start-progress { grid-column: 1; }
#view.start-view .modes { grid-template-columns: 1fr; gap: 10px; }
#view.start-view .mode { padding: 15px 16px; }
#view.start-view .start-options > .row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px 16px;
  align-items: start;
}
#view.start-view .field { min-width: 0; width: 100%; }
#view.start-view .field select,
#view.start-view .field .file-input { width: 100%; min-width: 0; }
#view.start-view .start-progress .row { align-items: end; gap: 12px; }
#view.start-view .start-progress .field { flex: 1 1 100%; }
#view.start-view .start-progress #expProg { align-self: flex-start; }
#view.start-view .start-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 4px 0 18px;
  border-top: 1px solid var(--line);
}
#view.start-view .start-actions .btn.primary { min-width: 210px; justify-content: center; }
#view.start-view .start-actions .hint { text-align: right; }
#view.start-view .resume { grid-column: 1 / -1; margin: 0; }

/* Màn hình làm bài: vùng đọc rộng vừa đủ, bảng điều hướng riêng biệt */
body[data-view="test"] main { max-width: 1240px; padding-top: 22px; }
#view.test-view .test {
  grid-template-columns: minmax(0, 1fr) 270px;
  gap: clamp(16px, 2.2vw, 26px);
}
#view.test-view #qwrap { min-width: 0; }
#view.test-view .quiz-context {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 11px;
  font-size: 11px;
  line-height: 1.5;
  letter-spacing: .09em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
#view.test-view .card { padding: clamp(20px, 3vw, 34px); }
#view.test-view .meta { justify-content: space-between; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
#view.test-view .qno { font-size: 18px; letter-spacing: -.35px; }
#view.test-view .qno small { font-family: var(--mono); font-size: 12px; }
#view.test-view .stem { max-width: 76ch; font-size: clamp(17px, 1.65vw, 19px); }
#view.test-view .opts { gap: 10px; margin-top: 18px; }
#view.test-view .opt { min-height: 56px; align-items: center; padding: 14px 16px; }
#view.test-view .opt .let { width: 30px; height: 30px; display: grid; place-items: center; margin-top: 0; }
#view.test-view .side { top: calc(env(safe-area-inset-top, 0px) + 78px); padding: 18px; }
#view.test-view .side-h { gap: 12px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
#view.test-view .side-h strong { font-size: 14px; }
#view.test-view .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; }
#view.test-view .grid button { height: 38px; }
#view.test-view .legend { gap: 9px 12px; }
#view.test-view .actions { gap: 10px; margin-top: 14px; }
#view.test-view .actions .btn { min-height: 42px; }
#view.test-view .actions [data-act="flag"] { margin-inline: auto; }
#top .top-in { max-width: 1240px; min-height: 58px; }

/* Màn hình kết quả: điểm tổng quan, phân bố, phân tích và rà soát */
body[data-view="result"] main { max-width: 1180px; padding-top: 22px; }
#view.result-view {
  display: grid;
  grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
  align-items: stretch;
  gap: 16px;
}
#view.result-view > .res-hero,
#view.result-view > .result-batch-summary,
#view.result-view > .result-breakdown,
#view.result-view > .result-actions,
#view.result-view > .review-heading,
#view.result-view > .chips,
#view.result-view > .revlist { grid-column: 1 / -1; }
#view.result-view > .res-hero {
  grid-column: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  min-width: 0;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: clamp(22px, 3.5vw, 38px);
  margin: 0;
}
#view.result-view .res-hero h1 { font-size: clamp(24px, 3vw, 34px); }
#view.result-view .big { margin: 18px 0 8px; font-size: clamp(64px, 8vw, 94px); letter-spacing: -4px; }
#view.result-view .sub2 { line-height: 1.7; margin-bottom: 0; }
#view.result-view .result-overview {
  grid-column: 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  margin: 0;
  padding: clamp(20px, 3vw, 30px);
}
#view.result-view .result-overview h2 { font-size: 14px; margin-bottom: 22px; }
#view.result-view .seg { height: 12px; margin: 0 0 18px; }
#view.result-view .counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; font-size: 13px; }
#view.result-view .counts span { white-space: nowrap; }
#view.result-view .result-batch-summary { margin: 0; }
#view.result-view .result-breakdown { margin: 0; gap: 16px; }
#view.result-view .result-breakdown > .panel { margin: 0; min-width: 0; }
#view.result-view .brk { grid-template-columns: minmax(84px, 145px) minmax(30px, 1fr) auto; gap: 8px 12px; }
#view.result-view .result-actions {
  justify-content: flex-start;
  align-items: center;
  gap: 10px;
  padding: 16px 0 8px;
  border-top: 1px solid var(--line);
}
#view.result-view .result-actions .btn { min-height: 42px; }
#view.result-view .review-heading { display: flex; align-items: end; justify-content: space-between; padding-top: 8px; }
#view.result-view .review-heading h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.4px; }
#view.result-view .review-heading p { margin: 0; }
#view.result-view .chips { margin: 0 0 4px; padding: 12px 0; border-bottom: 1px solid var(--line); }
#view.result-view .fchip { padding: 7px 14px; }
#view.result-view .revlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
#view.result-view .review-item { min-width: 0; }
#view.result-view .review-item .quiz-context { margin: 0 0 8px; font-size: 11px; letter-spacing: .07em; overflow-wrap: anywhere; }
#view.result-view .review-item .card { height: 100%; padding: clamp(16px, 2vw, 23px); }
#view.result-view .review-item .stem { font-size: 16px; line-height: 1.65; }
#view.result-view .review-item .opt { padding: 10px 12px; font-size: 14px; }
#view.result-view .review-item .opt .let { width: 26px; height: 26px; }

@media (max-width: 900px) {
  #view.start-view { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #view.start-view .start-options > .row { grid-template-columns: minmax(0, 1fr); }
  #view.test-view .test { grid-template-columns: minmax(0, 1fr); }
  #view.test-view .side { top: auto; }
  #view.result-view { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
@media (max-width: 640px) {
  #view.start-view { display: flex; flex-direction: column; gap: 13px; }
  #view.start-view > * { width: 100%; }
  #view.start-view > .start-hero {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 0; padding: 14px 0 8px;
  }
  #view.start-view .start-hero h1 { font-size: clamp(28px, 8vw, 36px); max-width: 100%; }
  #view.start-view .start-hero .abcd { align-self: flex-start; margin: 5px 0 14px; }
  #view.start-view .start-hero .lede { font-size: 14px; }
  #view.start-view .start-modes .modes { grid-template-columns: minmax(0, 1fr); }
  #view.start-view .start-options > .row { grid-template-columns: minmax(0, 1fr); gap: 15px; }
  #view.start-view .start-progress .row { display: flex; flex-direction: column; align-items: stretch; }
  #view.start-view .start-actions { flex-direction: column; align-items: stretch; }
  #view.start-view .start-actions .btn.primary { width: 100%; }
  #view.start-view .start-actions .hint { text-align: left; }
  #view.test-view .card { padding: 17px; }
  #view.test-view .meta { margin-bottom: 14px; padding-bottom: 11px; }
  #view.test-view .stem { font-size: 16px; }
  #view.test-view .opt { padding: 12px; gap: 10px; }
  #view.test-view .actions { display: grid; grid-template-columns: 1fr 1fr; }
  #view.test-view .actions [data-act="flag"] { grid-column: 1 / -1; grid-row: 1; margin: 0; }
  #view.test-view .actions [data-act="prev"] { grid-column: 1; grid-row: 2; }
  #view.test-view .actions [data-act="next"] { grid-column: 2; grid-row: 2; }
  #view.result-view { display: flex; flex-direction: column; gap: 13px; }
  #view.result-view > * { width: 100%; }
  #view.result-view > .res-hero { padding: 22px; }
  #view.result-view .big { font-size: 68px; margin-top: 14px; }
  #view.result-view .result-overview .counts { gap: 8px; font-size: 12px; }
  #view.result-view .result-breakdown { grid-template-columns: minmax(0, 1fr); }
  #view.result-view .result-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #view.result-view .result-actions .btn { width: 100%; min-height: 42px; }
  #view.result-view .review-heading h2 { font-size: 18px; }
  #view.result-view .revlist { grid-template-columns: minmax(0, 1fr); gap: 13px; }
}


/* ===== Ôn lý thuyết (Markdown) ===== */
.modeswitch{display:inline-flex;gap:2px;padding:3px;border:1px solid #303030;border-radius:999px;background:#0c0c0c;max-width:100%}
.modeswitch button{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 15px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.modeswitch button:hover{color:var(--ink)}
.modeswitch button[aria-selected="true"]{background:#f5f5f5;color:#090909;font-weight:600}
.modeswitch button i{font-size:17px}
#view.start-view > .start-switch{grid-column:1/-1}
#top .brand{margin-left:0}

body[data-view="notes"] main{max-width:1240px;padding-top:22px}
.notes{display:grid;grid-template-columns:290px minmax(0,1fr);gap:clamp(16px,2.2vw,28px);align-items:start}
.nmain{min-width:0}
#view.dropping .nmain{outline:2px dashed #8a8a8a;outline-offset:6px;border-radius:18px}
@media (min-width:901px){#view.notes-view .side{top:calc(env(safe-area-inset-top,0px) + 78px)}}

/* danh sách tài liệu + mục lục */
.doclist{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.doc{display:flex;align-items:stretch;border:1px solid transparent;border-radius:12px}
.doc.on{background:rgba(255,255,255,.07);border-color:#3a3a3a}
.doc-open{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:9px 10px;border:0;border-radius:12px;background:none;text-align:left;font-size:14px;line-height:1.35}
.doc-open span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.doc-open i{flex:none;font-size:17px;color:var(--muted)}
.doc:not(.on) .doc-open:hover{background:rgba(255,255,255,.04)}
.doc-del{flex:none;width:36px;border:0;border-radius:12px;background:none;color:#7a7a7a}
.doc-del:hover{color:#fff;background:rgba(255,255,255,.07)}
.doc-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.doc-actions .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px;font-size:13px}
.toc-h{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.toc{display:flex;flex-direction:column;gap:1px}
.toc a{display:block;padding:5px 10px;border-left:2px solid transparent;border-radius:0 8px 8px 0;color:#b0b0b0;font-size:13.5px;line-height:1.4;text-decoration:none;overflow-wrap:anywhere}
.toc a:hover{color:#fff;background:rgba(255,255,255,.04)}
.toc a.on{color:#fff;border-left-color:#f5f5f5;background:rgba(255,255,255,.06)}
.toc a.l1{font-weight:600;color:#dcdcdc}
.toc a.l2{padding-left:22px}
.toc a.l3{padding-left:34px}
.toc a.l4{padding-left:46px;font-size:13px}

/* tờ giấy đọc */
.md-sheet{background:rgba(20,20,20,.94);border:1px solid #303030;border-radius:18px;padding:clamp(20px,4vw,44px);box-shadow:0 12px 36px rgba(0,0,0,.12)}
.md-end{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:16px 0 0}
.md-end h2{margin:0 0 4px}
.md-end p{margin:0}
.md-empty{padding:clamp(22px,4vw,40px)}
.md-empty>i{display:block;margin-bottom:12px;font-size:34px;color:var(--muted)}
.md-empty h2{margin:0 0 8px;font-size:20px}
.md-empty p{max-width:56ch;margin:0 0 18px;color:var(--muted)}

/* chữ trong bài */
.md{max-width:76ch;font-size:16.5px;line-height:1.8;color:#e6e6e6;overflow-wrap:anywhere}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:1.9em 0 .6em;line-height:1.3;font-weight:700;letter-spacing:-.02em;color:var(--ink);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.md h1{margin-top:0;padding-bottom:.5em;border-bottom:1px solid var(--line);font-size:30px;letter-spacing:-.04em}
.md h2{font-size:23px}
.md h3{font-size:19px}
.md h4{font-size:16.5px}
.md h5,.md h6{font-size:14.5px;color:var(--muted)}
.md p{margin:0 0 1em}
.md strong{font-weight:700;color:#fff}
.md del{color:var(--muted)}
.md mark{padding:0 .25em;border-radius:4px;background:rgba(255,255,255,.2);color:#fff;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.md a{color:var(--ink);text-decoration:underline;text-decoration-color:#6b6b6b;text-underline-offset:3px}
.md a:hover{text-decoration-color:var(--ink)}
.md code{padding:.1em .4em;border:1px solid #2c2c2c;border-radius:6px;background:#1c1c1c;font-family:var(--mono);font-size:.875em}
.md ul,.md ol{margin:0 0 1em;padding-left:1.5em}
.md li{margin:.3em 0}
.md li::marker{color:#8a8a8a}
.md li>p{margin:0 0 .5em}
.md li>ul,.md li>ol{margin:.3em 0}
.md li.task{list-style:none}

<script>
(function(){
'use strict';

var DATA=[];
var QUIZ_TITLE='';
var QUIZ_FILENAME='';
var QUIZ_SIGNATURE='';
var LET='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
var TYPE={'1':'Nhận biết','2':'Vận dụng','3':'Nâng cao'};
var KEY='quiz_session_v2_unloaded';
var PACK_KEY='quiz_pack_v1';
var PREFS_KEY='quiz_prefs_v1';
var S=null,timerId=null,ui={modal:false,filter:'all'};
var PREFS={mode:'practice',scope:'all',minutes:0,shuffleQ:false,shuffleO:false,batch50:false};

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(ms){ms=Math.max(0,Math.round(ms/1000));var h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60,p=function(n){return (n<10?'0':'')+n};return (h?h+':':'')+p(m)+':'+p(s)}
function save(){try{if(S&&DATA.length)localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var r=localStorage.getItem(KEY);if(!r)return null;var o=JSON.parse(r);if(o&&o.v===2&&Array.isArray(o.order)&&o.order.length)return o}catch(e){}return null}
function clearSaved(){try{localStorage.removeItem(KEY)}catch(e){}}
function savePack(){
  try{
    if(!DATA.length){localStorage.removeItem(PACK_KEY);return}
    localStorage.setItem(PACK_KEY,JSON.stringify({
      v:1,title:QUIZ_TITLE,filename:QUIZ_FILENAME,signature:QUIZ_SIGNATURE,questions:DATA,savedAt:new Date().toISOString()
    }));
  }catch(e){
    /* Bộ đề lớn có thể vượt quota localStorage — vẫn dùng trong phiên hiện tại */
    console.warn('Không lưu được bộ đề vào trình duyệt:',e&&e.message?e.message:e);
  }
}
function loadPack(){
  try{
    var r=localStorage.getItem(PACK_KEY);if(!r)return false;
    var o=JSON.parse(r);
    if(!o||o.v!==1||!Array.isArray(o.questions)||!o.questions.length)return false;
    DATA=o.questions;
    QUIZ_TITLE=String(o.title||'Bộ câu hỏi');
    QUIZ_FILENAME=String(o.filename||'');
    QUIZ_SIGNATURE=String(o.signature||'');
    KEY='quiz_session_v2_'+hashText(QUIZ_SIGNATURE||(QUIZ_TITLE+DATA.length));
    document.title=QUIZ_TITLE+' — Trắc nghiệm';
    return true;
  }catch(e){return false}
}
function clearPack(){try{localStorage.removeItem(PACK_KEY)}catch(e){}}
function loadPrefs(){
  try{
    var r=localStorage.getItem(PREFS_KEY);if(!r)return;
    var o=JSON.parse(r);if(!o||typeof o!=='object')return;
    if(o.mode==='practice'||o.mode==='exam')PREFS.mode=o.mode;
    if(o.scope!=null)PREFS.scope=String(o.scope);
    if([0,30,60,90,120].indexOf(+o.minutes)>=0)PREFS.minutes=+o.minutes;
    PREFS.shuffleQ=!!o.shuffleQ;PREFS.shuffleO=!!o.shuffleO;PREFS.batch50=!!o.batch50;
  }catch(e){}
}
function savePrefs(partial){
  if(partial&&typeof partial==='object'){
    if(partial.mode==='practice'||partial.mode==='exam')PREFS.mode=partial.mode;
    if(partial.scope!=null)PREFS.scope=String(partial.scope);
    if(partial.minutes!=null&&[0,30,60,90,120].indexOf(+partial.minutes)>=0)PREFS.minutes=+partial.minutes;
    if(partial.shuffleQ!=null)PREFS.shuffleQ=!!partial.shuffleQ;
    if(partial.shuffleO!=null)PREFS.shuffleO=!!partial.shuffleO;
    if(partial.batch50!=null)PREFS.batch50=!!partial.batch50;
  }
  try{localStorage.setItem(PREFS_KEY,JSON.stringify(PREFS))}catch(e){}
}
function readStartCfg(){
  var modeEl=document.querySelector('input[name=mode]:checked');
  return {
    mode:modeEl?modeEl.value:PREFS.mode,
    scope:$('#scope')?$('#scope').value:PREFS.scope,

function hashText(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function levelNumber(raw){
  var v=String(raw==null?1:raw).trim().toLowerCase();
  if(v==='1'||v==='nb'||v==='recognition'||v==='nhận biết')return 1;
  if(v==='2'||v==='vd'||v==='th'||v==='application'||v==='vận dụng'||v==='thông hiểu')return 2;
  if(v==='3'||v==='nc'||v==='advanced'||v==='nâng cao')return 3;
  return 1;
}
function normalizeBlocks(item){
  var out=[],raw=item.blocks||item.media||[];
  if(Array.isArray(raw))raw.forEach(function(b){
    if(typeof b==='string'){out.push({k:'text',v:b});return}
    if(!b||typeof b!=='object')return;
    var t=String(b.k||b.type||b.kind||'text').toLowerCase();
    var v=b.v!=null?b.v:(b.src!=null?b.src:(b.url!=null?b.url:(b.content!=null?b.content:(b.code!=null?b.code:''))));
    if(t==='img'||t==='image'||t==='picture')out.push({k:'img',v:String(v)});
    else if(t==='code'||t==='source')out.push({k:'code',v:String(v)});
    else out.push({k:'text',v:String(v)});
  });
  var imageValue=item.image!=null?item.image:(item.img!=null?item.img:item.images);
  if(imageValue!=null){(Array.isArray(imageValue)?imageValue:[imageValue]).forEach(function(im){
    var src=typeof im==='string'?im:(im&&(im.src||im.url||im.content))||'';
    if(src)out.push({k:'img',v:String(src)});
  })}
  var codeValue=item.code!=null?item.code:item.sourceCode;
  if(codeValue!=null){(Array.isArray(codeValue)?codeValue:[codeValue]).forEach(function(code){
    var content=typeof code==='string'?code:(code&&(code.content||code.code||code.v))||'';
    if(content)out.push({k:'code',v:String(content)});
  })}
  return out;
}
function normalizeQuestions(questions){
  if(!Array.isArray(questions)||!questions.length)throw new Error('File không có mảng câu hỏi hoặc mảng câu hỏi đang rỗng.');
  return questions.map(function(item,index){
    if(!item||typeof item!=='object')throw new Error('Câu '+(index+1)+' không phải một đối tượng hợp lệ.');
    var stem=item.question!=null?item.question:(item.stem!=null?item.stem:item.text);
    var opts=item.answers!=null?item.answers:(item.opts!=null?item.opts:item.options);
    var ans=item.correct!=null?item.correct:item.ans;
    if(typeof stem!=='string'||!stem.trim())throw new Error('Câu '+(index+1)+' thiếu trường question.');
    if(!Array.isArray(opts)||opts.length<2)throw new Error('Câu '+(index+1)+' cần có mảng answers gồm ít nhất 2 đáp án.');
    opts=opts.map(function(o){return String(o)});
    if(typeof ans==='string'&&/^[A-Z]$/i.test(ans.trim()))ans=ans.trim().toUpperCase().charCodeAt(0)-65;
    ans=Number(ans);
    if(!Number.isInteger(ans)||ans<0||ans>=opts.length)throw new Error('Câu '+(index+1)+' có correct không hợp lệ. correct phải là chỉ số đáp án bắt đầu từ 0.');
    var rawLevel=item.level!=null?item.level:(item.classification!=null?item.classification:(item.difficulty!=null?item.difficulty:item.type));
    var rawReason=item.reason;
    return {
      n:index+1,
      clo:item.clo||'',
      cloTitle:item.cloTitle||'',
      group:String(item.group||item.topic||item.category||'Chưa phân nhóm'),
      type:levelNumber(rawLevel),
      stem:stem,
      blocks:normalizeBlocks(item),
      opts:opts,
      ans:ans,
      reason:rawReason==null?'none':String(rawReason)
    };
  });
}
function decodeJsString(value){
  if(!value)return '';
  if(value.charAt(0)==='"'){try{return JSON.parse(value)}catch(e){}}
  return value.slice(1,-1).replace(/\\'/g,"'").replace(/\\n/g,'\n').replace(/\\\\/g,'\\');
}
function parseQuizText(text,fileName){
  var parsed;
  try{parsed=JSON.parse(text)}catch(jsonError){
    var titleMatch=text.match(/(?:const|let|var)\s+(?:quizTitle|quizName|title|name)\s*=\s*("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')\s*;?/i);
    var declaration=text.match(/(?:const|let|var)\s+(?:quizQuestions|questions)\s*=\s*/i);
    if(!declaration)throw new Error('Không đọc được JSON. Hãy dùng định dạng { "title": "Tên bộ đề", "questions": [...] } hoặc khai báo const quizQuestions = [...].');
    var start=declaration.index+declaration[0].length;
    while(/\s/.test(text.charAt(start)))start++;
    if(text.charAt(start)!=='[')throw new Error('Không tìm thấy mảng quizQuestions.');
    var end=text.lastIndexOf(']');
    if(end<start)throw new Error('Mảng quizQuestions chưa đóng bằng dấu ].');
    var arr;
    try{arr=JSON.parse(text.slice(start,end+1))}catch(e){throw new Error('Mảng quizQuestions chưa phải JSON hợp lệ. Hãy dùng dấu ngoặc kép cho tên trường và chuỗi, đồng thời không để dấu phẩy thừa cuối phần tử.')}
    parsed={title:titleMatch?decodeJsString(titleMatch[1]):'',questions:arr};
  }
  var title='',questions;
  if(Array.isArray(parsed)){questions=parsed}
  else if(parsed&&typeof parsed==='object'){
    title=parsed.title||parsed.name||parsed.quizTitle||parsed.quizName||parsed.examTitle||'';
    questions=parsed.questions||parsed.quizQuestions||parsed.items;
  }
  if(!title)title=(fileName||'Bộ câu hỏi trắc nghiệm').replace(/\.[^.]+$/,'');
  var normalized=normalizeQuestions(questions);
  var signature=title+'\u0000'+normalized.map(function(q){return q.stem+'\u0001'+q.opts.join('\u0001')+'\u0001'+q.ans+'\u0001'+q.type}).join('\u0002');
  return {title:String(title),questions:normalized,signature:signature};
}
function reasonIsMissing(reason){return reason==null||String(reason).trim()===''||String(reason).trim().toLowerCase()==='none'}
function explanationHTML(q){
  if(reasonIsMissing(q.reason))return '<section class="explanation"><strong>Giải thích</strong><p>Đáp án đúng là: '+esc(q.opts[q.ans])+'</p></section>';
  return '<section class="explanation"><strong>Giải thích</strong><p>'+esc(q.reason)+'</p></section>';
}

function chunkArray(array,size){var chunks=[];for(var i=0;i<array.length;i+=size)chunks.push(array.slice(i,i+size));return chunks}
function startSession(cfg,subset,continuation,retryContext){
  var idx,perm,batch=null;
  if(continuation){
    batch=continuation.batch;perm=continuation.perm;idx=batch.chunks[batch.chunkIndex].slice();
  }else{
    idx=(subset!==undefined?subset.slice():DATA.map(function(_,i){return i}).filter(function(i){return cfg.batch50||cfg.scope==='all'||DATA[i].type===Number(cfg.scope)}));
    if(cfg.shuffleQ)idx=shuffle(idx);
    perm={};idx.forEach(function(i){perm[i]=cfg.shuffleO?shuffle(DATA[i].opts.map(function(_,pos){return pos})):DATA[i].opts.map(function(_,pos){return pos})});
    if(cfg.batch50&&subset===undefined){batch={enabled:true,chunks:chunkArray(idx,50),chunkIndex:0,results:[]};idx=batch.chunks[0].slice()}
  }
  if(!idx.length){openModal('<h3>Không có câu hỏi</h3><p>Phạm vi đã chọn không có câu hỏi nào.</p><div class="btns"><button class="btn primary" id="emptyok">Đóng</button></div>');$('#emptyok').onclick=closeModal;return}
  var now=Date.now();
  S={v:2,cfg:cfg,order:idx,perm:perm,ans:{},flags:{},i:0,startedAt:now,endAt:cfg.minutes?now+cfg.minutes*60000:null,submitted:false,submittedAt:null,batch:batch,retryContext:retryContext||null};
  save();showTest();
}

  var defs=[['all','Tất cả'],['bad','Sai'],['na','Bỏ trống'],['flag','Đã đánh dấu']];

function progStatus(msg,bad){var el=$('#progStatus');if(el){el.textContent=msg;el.classList.toggle('error-text',!!bad)}}
function exportProgress(){
  var cur=S||load();

  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
  progStatus('Đã xuất file tiến độ.');

function validSession(s,depth){
  var n=DATA.length;
  function isIdx(x){return Number.isInteger(x)&&x>=0&&x<n}
  if(!s||typeof s!=='object'||s.v!==2)return false;
  if(!s.cfg||typeof s.cfg!=='object'||(s.cfg.mode!=='practice'&&s.cfg.mode!=='exam'))return false;
  if(!Array.isArray(s.order)||!s.order.length||!s.order.every(isIdx)||new Set(s.order).size!==s.order.length)return false;
  if(!s.perm||typeof s.perm!=='object'||!s.ans||typeof s.ans!=='object'||!s.flags||typeof s.flags!=='object')return false;
  var inOrder={};s.order.forEach(function(q){inOrder[q]=1});
  var good=s.order.every(function(qi){
    var p=s.perm[qi],k=DATA[qi].opts.length;
    if(!Array.isArray(p)||p.length!==k||p.slice().sort(function(a,b){return a-b}).some(function(v,i){return v!==i}))return false;
    var a=s.ans[qi];return a===undefined||(Number.isInteger(a)&&a>=0&&a<k);
  });
  if(!good||Object.keys(s.ans).some(function(k){return !inOrder[k]}))return false;
  if(!Number.isInteger(s.i)||s.i<0||s.i>=s.order.length)return false;
  if(typeof s.submitted!=='boolean'||!Number.isFinite(s.startedAt))return false;
  if(s.endAt!=null&&!Number.isFinite(s.endAt))return false;
  if(s.submitted&&!Number.isFinite(s.submittedAt))return false;
  if(s.batch!=null){var b=s.batch;if(typeof b!=='object'||!Array.isArray(b.chunks)||!b.chunks.length||!b.chunks.every(function(c){return Array.isArray(c)&&c.every(isIdx)})||!Number.isInteger(b.chunkIndex)||b.chunkIndex<0||b.chunkIndex>=b.chunks.length||!Array.isArray(b.results))return false}
  if(s.retryContext!=null){if((depth||0)>0||typeof s.retryContext!=='object'||!validSession(s.retryContext.parent,1))return false}
  return true;
}
function sigBody(s){s=String(s||'');var i=s.indexOf('\u0000');return i<0?s:s.slice(i+1)}
function sigParts(s){return sigBody(s).split('\u0002').map(function(x){return x.normalize('NFC').replace(/\s+/g,' ').trim()})}
function compareSig(ps,cs){
  var pa=sigParts(ps),pb=sigParts(cs);
  if(pa.length!==pb.length)return {err:'Số câu không khớp: file tiến độ được lưu từ bộ đề '+pa.length+' câu, còn bộ đề đang mở có '+pb.length+' câu. Hãy mở đúng file câu hỏi đã dùng khi lưu tiến độ.'};
  var bad=[];pa.forEach(function(x,i){if(x!==pb[i])bad.push(i)});
  if(!bad.length)return {warn:''};
  if(bad.length>Math.max(5,Math.round(pa.length*0.02)))return {err:bad.length+'/'+pa.length+' câu khác nhau giữa file tiến độ và bộ đề đang mở (ví dụ câu '+(bad[0]+1)+'). Có vẻ đây là hai phiên bản khác nhau của bộ đề.'};
  return {warn:'<p>Lưu ý: có '+bad.length+' câu khác nhẹ so với lúc lưu tiến độ (câu '+bad.slice(0,5).map(function(i){return i+1}).join(', ')+(bad.length>5?'…':'')+').</p>'};
}
function progAlert(title,msg){openModal('<h3>'+title+'</h3><p>'+msg+'</p><div class="btns"><button class="btn primary" id="pgok">Đóng</button></div>');$('#pgok').onclick=closeModal}
function importProgress(file){
  if(!DATA.length){progAlert('Chưa nạp bộ câu hỏi','Hãy chọn file bộ câu hỏi (.json) ở phần trên trước, sau đó mới nạp file tiến độ.');return}
  var r=new FileReader();
  r.onerror=function(){progAlert('Không đọc được file','Không đọc được file tiến độ đã chọn.')};
  r.onload=function(){
    try{
      var o=JSON.parse(String(r.result||''));
      if(!o||o.app!=='quiz-progress'||!o.session||!Array.isArray(o.session.order))throw new Error('Đây không phải file tiến độ hợp lệ. Hãy chọn file có tên dạng ...-tien-do.json.');
      var cmp=compareSig(o.signature,QUIZ_SIGNATURE);if(cmp.err)throw new Error(cmp.err);
      var cand=o.session;
      if(!validSession(cand,0))throw new Error('File tiến độ thiếu hoặc hỏng dữ liệu phiên làm bài. Phiên hiện tại được giữ nguyên.');
      var cur=S||load(),done=Object.keys(cand.ans||{}).length;
      var warn=(cur&&!cur.submitted)?'<p>Bài đang làm trên máy này ('+Object.keys(cur.ans||{}).length+'/'+cur.order.length+' câu) sẽ bị thay thế.</p>':'';
      openModal('<h3>Nạp tiến độ này?</h3><p>Tiến độ trong file: <b>'+done+'/'+cand.order.length+'</b> câu'+(cand.submitted?' (đã nộp bài)':'')+'.</p>'+cmp.warn+warn+'<div class="btns"><button class="btn" id="pgno">Hủy</button><button class="btn primary" id="pgyes">Dùng tiến độ này</button></div>');
      $('#pgno').onclick=closeModal;
      $('#pgyes').onclick=function(){
        closeModal();S=cand;save();showStart();
        var b=$('#resume');if(b&&b.scrollIntoView)b.scrollIntoView({block:'center',behavior:'smooth'});
      };
    }catch(e){progAlert('Không nạp được tiến độ',esc(e.message||'Lỗi không xác định.'))}
  };
  r.readAsText(file,'UTF-8');
}

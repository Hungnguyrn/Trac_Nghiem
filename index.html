function mdPlain(html){return String(html).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim()}
function mdSlug(text,used){
  var s=String(text).replace(/&(?:amp|lt|gt|quot|#39);/g,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'muc';
  var base='h-'+s,id=base,n=1;
  while(used[id]){n++;id=base+'-'+n}
  used[id]=1;return id;
}
function mdSafeUrl(u,img){
  u=String(u).trim();
  if(/^(https?:\/\/|mailto:|#)/i.test(u))return u;
  if(img&&/^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+\/=]+$/i.test(u))return u;
  if(!/^[a-z][a-z0-9+.\-]*:/i.test(u))return u;
  return '';
}

/* Định dạng trong dòng: **đậm**, *nghiêng*, ~~gạch~~, ==nổi bật==, `mã`, [chữ](url), ![alt](url) */
function mdInline(src){
  var tok=[];
  function put(h){tok.push(h);return '\u0003'+(tok.length-1)+'\u0003'}
  function emph(t){
    return t
      .replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g,'<strong><em>$1</em></strong>')
      .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g,'<strong>$1</strong>')
      .replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g,'$1<strong>$2</strong>')
      .replace(/(^|[^*\w])\*(?=[^\s*])([\s\S]*?[^\s*])\*(?!\*)/g,'$1<em>$2</em>')
      .replace(/(^|[^\w])_(?=[^\s_])([\s\S]*?[^\s_])_(?!\w)/g,'$1<em>$2</em>')
      .replace(/~~(?=\S)([\s\S]*?\S)~~/g,'<del>$1</del>')
      .replace(/==(?=\S)([\s\S]*?\S)==/g,'<mark>$1</mark>');
  }
  var s=String(src==null?'':src).replace(/[\u0000-\u0008]/g,'');
  s=s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g,function(m,a,c){return put('<code>'+esc(c.replace(/\n/g,' ').replace(/^ (.+) $/,'$1'))+'</code>')});
  s=s.replace(/\\([\\`*_{}\[\]()#+\-.!~=|<>])/g,function(m,c){return put(esc(c))});
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,function(m,alt,u){var url=mdSafeUrl(u,true);return url?put('<img src="'+url+'" alt="'+alt+'" loading="lazy">'):m});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(m,t,u){
    var url=mdSafeUrl(u);if(!url)return m;
    return put('<a href="'+url+'"'+(url.charAt(0)==='#'?'':' target="_blank" rel="noopener noreferrer"')+'>'+emph(t)+'</a>');
  });
  s=s.replace(/(^|[\s(>])(https?:\/\/[^\s<>"']*[^\s<>"'.,;:!?)])/g,function(m,a,u){return a+put('<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>')});
  s=emph(s);
  while(/\u0003\d+\u0003/.test(s))s=s.replace(/\u0003(\d+)\u0003/g,function(m,i){return tok[+i]});
  return s;
}

/* Tô màu mã đơn sắc: chú thích mờ, chuỗi sáng vừa, từ khóa đậm */
function mdHighlight(code,lang){
  lang=String(lang||'').toLowerCase();
  if(!lang||/^(text|txt|plain|plaintext|output|log|console)$/.test(lang))return esc(code);
  var sql=/^(sql|mysql|psql|postgres|plsql)$/.test(lang),markup=/^(html|xml|svg)$/.test(lang);
  var cm=[MD_C.block];
  if(markup)cm=[MD_C.html];
  else if(sql)cm.push(MD_C.sql);
  else{
    if(MD_HASH.indexOf(' '+lang+' ')>=0||lang==='php')cm.push(MD_C.hash);
    if(MD_SLASH.indexOf(' '+lang+' ')>=0)cm.push(MD_C.slash);
  }
  var kw=markup?'':(sql?MD_SQL:MD_KW);
  var re=new RegExp('('+cm.join('|')+')|('+MD_RE_STR+')|('+(markup?'(?!)':MD_RE_NUM)+')'+(kw?'|(\\b(?:'+kw+')\\b)':''),sql?'gi':'g');
  var out='',last=0,m;
  while((m=re.exec(code))){
    if(!m[0]){re.lastIndex++;continue}
    if(m.index>last)out+=esc(code.slice(last,m.index));
    out+='<span class="tk-'+(m[1]?'c':m[2]?'s':m[3]?'n':'k')+'">'+esc(m[0])+'</span>';
    last=re.lastIndex;
  }
  return out+esc(code.slice(last));
}
function mdCode(code,lang){
  return '<figure class="md-code"><figcaption><span>'+(lang?esc(lang):'mã')+'</span><button type="button" class="md-copy" data-copy aria-label="Chép đoạn mã"><i class="ph ph-copy" aria-hidden="true"></i><span>Chép</span></button></figcaption><pre tabindex="0"><code>'+mdHighlight(code,lang)+'</code></pre></figure>';
}

/* Khối: tiêu đề, đoạn, danh sách (lồng nhau, việc cần làm), mã, trích dẫn, ghi chú [!NOTE], bảng, đường kẻ */
function mdRender(src){
  var lines=String(src==null?'':src).replace(/\r\n?/g,'\n').split('\n');
  var used={},heads=[];
  var RE_FENCE=/^ {0,3}(`{3,}|~{3,})[ \t]*([^\s`]*)[^`]*$/;
  var RE_H=/^ {0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/;
  var RE_HR=/^ {0,3}([-*_])(?:\s*\1){2,}\s*$/;
  var RE_LI=/^(\s*)([-*+]|\d{1,9}[.)])(\s+)(.*)$/;

  function isBlank(l){return !/\S/.test(l)}
  function indentOf(l){var n=0;for(var k=0;k<l.length;k++){var c=l.charAt(k);if(c===' ')n++;else if(c==='\t')n+=4-(n%4);else break}return n}
  function dedent(l,k){
    l=l.replace(/^\t+/,function(t){return new Array(t.length+1).join('    ')});
    return l.slice(Math.min(k,l.match(/^ */)[0].length));
  }
  function isSep(l){return l.indexOf('|')>=0&&/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l)}
  function isListStart(l,interrupt){
    var m=l.match(RE_LI);
    if(!m||RE_HR.test(l))return false;
    if(interrupt&&(!m[4].trim()||(/\d/.test(m[2].charAt(0))&&parseInt(m[2],10)!==1)))return false;
    return true;
  }
  function blockStart(ls,i){
    var l=ls[i];
    return RE_FENCE.test(l)||RE_H.test(l)||RE_HR.test(l)||/^ {0,3}>/.test(l)||isListStart(l,true)||(l.indexOf('|')>=0&&i+1<ls.length&&isSep(ls[i+1]));
  }
  function cells(l){
    l=l.trim();if(l.charAt(0)==='|')l=l.slice(1);
    var out=[],cur='';
    for(var k=0;k<l.length;k++){
      var c=l.charAt(k);
      if(c==='\\'&&l.charAt(k+1)==='|'){cur+='|';k++}
      else if(c==='|'){out.push(cur);cur=''}
      else cur+=c;
    }
    if(cur.trim()!==''||!out.length)out.push(cur);
    return out.map(function(x){return x.trim()});
  }
  function table(head,al,rows){
    function cell(tag,c,k){return '<'+tag+(al[k]?' style="text-align:'+al[k]+'"':'')+'>'+mdInline(c)+'</'+tag+'>'}
    return '<div class="md-table"><table><thead><tr>'+head.map(function(c,k){return cell('th',c,k)}).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){var t='';for(var k=0;k<head.length;k++)t+=cell('td',r[k]||'',k);return '<tr>'+t+'</tr>'}).join('')+'</tbody></table></div>';
  }

  function list(ls,start){
    var first=ls[start].match(RE_LI),base=indentOf(ls[start]),ordered=/\d/.test(first[2].charAt(0));
    var num=ordered?parseInt(first[2],10):1,items=[],it=null,i=start,n=ls.length,loose=false;
    while(i<n){
      var l=ls[i];
      if(isBlank(l)){
        var j=i+1;while(j<n&&isBlank(ls[j]))j++;
        if(j>=n)break;
        var nl=ls[j],ni=indentOf(nl),nm=nl.match(RE_LI);
        if(ni>=base+2||(nm&&ni>=base&&!RE_HR.test(nl)&&/\d/.test(nm[2].charAt(0))===ordered)){
          loose=true;for(var k=i;k<j;k++)it.lines.push('');i=j;continue;
        }
        break;
      }
      var ind=indentOf(l),m=l.match(RE_LI);
      if(m&&!RE_HR.test(l)&&ind<base+2){
        if(ind<base||/\d/.test(m[2].charAt(0))!==ordered)break;
        it={ci:ind+m[2].length+Math.min(m[3].length,4),lines:[m[4]]};items.push(it);i++;continue;
      }
      if(ind>=base+2){it.lines.push(dedent(l,it.ci));i++;continue}
      if(blockStart(ls,i))break;
      it.lines.push(l.trim());i++;
    }
    var tag=ordered?'ol':'ul',html='<'+tag+(ordered&&num!==1?' start="'+num+'"':'')+'>';
    items.forEach(function(x){
      var body=x.lines.slice(),task=null,tm=body[0].match(/^\[( |x|X)\]\s+(.*)$/);
      if(tm){task=tm[1]!==' ';body[0]=tm[2]}
      var inner=blocks(body,!loose,true);
      if(task!==null)inner=inner.replace(/^(<p>)?/,function(m0){return (m0||'')+'<i class="ph '+(task?'ph-check-square':'ph-square')+' tk" aria-hidden="true"></i>'});
      html+='<li'+(task!==null?' class="task'+(task?' done':'')+'"':'')+'>'+inner+'</li>';
    });
    return {html:html+'</'+tag+'>',next:i};
  }

  function blocks(ls,tight,nested){
    var out=[],i=0,n=ls.length,m;
    while(i<n){
      var ln=ls[i];
      if(isBlank(ln)){i++;continue}
      if((m=ln.match(RE_FENCE))){
        var ch=m[1].charAt(0),len=m[1].length,lang=m[2],buf=[];
        var close=new RegExp('^ {0,3}'+ch+'{'+len+',}[ \\t]*$');
        i++;
        while(i<n&&!close.test(ls[i])){buf.push(ls[i]);i++}
        i++;out.push(mdCode(buf.join('\n'),lang));continue;
      }
      if((m=ln.match(RE_H))){
        var lv=m[1].length,h=mdInline(m[2]),id='';
        if(!nested){id=mdSlug(mdPlain(h),used);heads.push({lv:lv,id:id,t:mdPlain(h)})}
        out.push('<h'+lv+(id?' id="'+id+'"':'')+'>'+h+'</h'+lv+'>');i++;continue;
      }
      if(RE_HR.test(ln)){out.push('<hr>');i++;continue}
      if(/^ {0,3}>/.test(ln)){
        var q=[];
        while(i<n&&/^ {0,3}>/.test(ls[i])){q.push(ls[i].replace(/^ {0,3}> ?/,''));i++}
        var kind=null,cm=q[0].match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(.*)$/i);
        if(cm){kind=cm[1].toLowerCase();if(cm[2])q[0]=cm[2];else q.shift()}
        var inner=blocks(q,false,true);
        out.push(kind
          ?'<div class="callout '+kind+'"><div class="callout-t"><i class="ph '+MD_ICON[kind]+'" aria-hidden="true"></i>'+MD_LABEL[kind]+'</div>'+inner+'</div>'
          :'<blockquote>'+inner+'</blockquote>');
        continue;
      }
      if(ln.indexOf('|')>=0&&i+1<n&&isSep(ls[i+1])){
        var head=cells(ln),al=cells(ls[i+1]).map(function(c){var l=c.charAt(0)===':',r=c.charAt(c.length-1)===':';return l&&r?'center':(r?'right':(l?'left':''))});
        i+=2;var rows=[];
        while(i<n&&!isBlank(ls[i])&&ls[i].indexOf('|')>=0){rows.push(cells(ls[i]));i++}
        out.push(table(head,al,rows));continue;
      }
      if(isListStart(ln,false)){var res=list(ls,i);out.push(res.html);i=res.next;continue}
      var p=[ln.replace(/^\s+/,'')];i++;
      while(i<n&&!isBlank(ls[i])&&!blockStart(ls,i)){p.push(ls[i].replace(/^\s+/,''));i++}
      var txt=mdInline(p.join('\n').replace(/\\\n/g,'\n')).replace(/\n/g,'<br>');
      out.push(tight?txt:'<p>'+txt+'</p>');
    }
    return out.join('');
  }

  return {html:blocks(lines,false,false),heads:heads};
}


/* ---------- Cây sơ đồ tư duy: tự dựng từ tiêu đề và danh sách (không cần markmap-lib) ----------
   - Tiêu đề lồng theo cấp; nhảy cấp vẫn gắn vào tiêu đề nông hơn gần nhất.
   - Gạch đầu dòng luôn thành nút con của tiêu đề đứng trước nó, kể cả khi bên dưới còn tiêu đề con.
   - Bảng và khối mã thành một nút riêng; đoạn văn, trích dẫn và khung ghi chú không đưa lên sơ đồ.
   - Mọi chữ đều đi qua mdInline nên HTML thô bị escape. */
function mdOutline(src,title){
  var lines=String(src==null?'':src).replace(/\r\n?/g,'\n').split('\n'),n=lines.length,i=0;
  var RE_FENCE=/^ {0,3}(`{3,}|~{3,})[ \t]*([^\s`]*)[^`]*$/;
  var RE_H=/^ {0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/;
  var RE_HR=/^ {0,3}([-*_])(?:\s*\1){2,}\s*$/;
  var RE_LI=/^(\s*)([-*+]|\d{1,9}[.)])(\s+)(.*)$/;
  var rootV={raw:'',children:[]},hs=[{lv:0,node:rootV}];

  function blank(l){return !/\S/.test(l)}
  function ind(l){var k=0;for(var x=0;x<l.length;x++){var c=l.charAt(x);if(c===' ')k++;else if(c==='\t')k+=4-(k%4);else break}return k}
  function isLi(l){return RE_LI.test(l)&&!RE_HR.test(l)}
  function isSep(l){return l.indexOf('|')>=0&&/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l)}
  function startsBlock(j){
    var l=lines[j],m;
    if(RE_FENCE.test(l)||RE_H.test(l)||RE_HR.test(l)||/^ {0,3}>/.test(l))return true;
    if((m=l.match(RE_LI))&&!RE_HR.test(l)&&m[4].trim()&&!(/\d/.test(m[2].charAt(0))&&parseInt(m[2],10)!==1))return true;
    return l.indexOf('|')>=0&&j+1<n&&isSep(lines[j+1]);
  }
  function cur(){return hs[hs.length-1].node}
  function fence(idx,m,lead){
    var ch=m[1].charAt(0),len=m[1].length,buf=[],j=idx+1,close=new RegExp('^'+lead+ch+'{'+len+',}[ \\t]*$'),strip=new RegExp('^ {0,'+ind(lines[idx])+'}');
    while(j<n&&!close.test(lines[j])){buf.push(lines[j].replace(strip,''));j++}
    return {code:buf.join('\n'),next:j+1};
  }
  function codeNode(code){return code.trim()?{html:'<pre><code>'+esc(code)+'</code></pre>',children:[]}:null}

  function readList(start){
    var j=start,stack=[],last=null,afterBlank=false;
    while(j<n){
      var l=lines[j];
      if(blank(l)){
        var k=j+1;while(k<n&&blank(lines[k]))k++;
        if(k>=n)break;
        if(isLi(lines[k])||ind(lines[k])>=2){j=k;afterBlank=true;continue}
        break;
      }
      var m=l.match(RE_LI),indent=ind(l),tl=l.replace(/^\s+/,'');
      if(m&&!RE_HR.test(l)){
        while(stack.length&&stack[stack.length-1].indent>=indent)stack.pop();
        var parent=stack.length?stack[stack.length-1].node:cur();
        var body=m[4],pre='',tm=body.match(/^\[( |x|X)\]\s+(.*)$/);
        if(tm){pre=tm[1]===' '?'\u2610 ':'\u2611 ';body=tm[2]}
        else if(/\d/.test(m[2].charAt(0)))pre=m[2]+' ';
        last={raw:body,pre:pre,children:[]};
        parent.children.push(last);stack.push({indent:indent,node:last});
        afterBlank=false;j++;continue;
      }
      var fm=last&&indent>=2?tl.match(RE_FENCE):null;
      if(fm){
        var f=fence(j,fm,' *'),cn=codeNode(f.code);
        if(cn)last.children.push(cn);
        afterBlank=false;j=f.next;continue;
      }
      if(indent>=2||(!afterBlank&&last&&!startsBlock(j))){
        if(last&&!afterBlank)last.raw+='\n'+tl;
        afterBlank=false;j++;continue;
      }
      break;
    }
    return j;
  }

  /* phần đầu file kiểu --- YAML --- không thuộc nội dung */
  if(n&&lines[0].trim()==='---'){
    for(var e=1;e<Math.min(n,40);e++){if(lines[e].trim()==='---'){i=e+1;break}}
  }
  while(i<n){
    var ln=lines[i],m;
    if(blank(ln)){i++;continue}
    if((m=ln.match(RE_FENCE))){
      var fr=fence(i,m,' {0,3}'),cn=codeNode(fr.code);
      if(cn)cur().children.push(cn);
      i=fr.next;continue;
    }
    if((m=ln.match(RE_H))){
      var lv=m[1].length;
      while(hs.length>1&&hs[hs.length-1].lv>=lv)hs.pop();
      var hn={raw:m[2],h:lv,children:[]};
      cur().children.push(hn);hs.push({lv:lv,node:hn});i++;continue;
    }
    if(RE_HR.test(ln)){i++;continue}
    if(/^ {0,3}>/.test(ln)){while(i<n&&/^ {0,3}>/.test(lines[i]))i++;continue}
    if(ln.indexOf('|')>=0&&i+1<n&&isSep(lines[i+1])){
      var t=[ln,lines[i+1]];i+=2;
      while(i<n&&!blank(lines[i])&&lines[i].indexOf('|')>=0){t.push(lines[i]);i++}
      cur().children.push({html:mdRender(t.join('\n')).html,children:[]});continue;
    }
    if(isLi(ln)){i=readList(i);continue}
    i++;while(i<n&&!blank(lines[i])&&!startsBlock(i))i++;
  }

  function fin(nd){
    var c=nd.html!=null?nd.html:(nd.pre?esc(nd.pre):'')+mdInline(nd.raw||'').replace(/\n/g,'<br>');
    return {content:c,children:nd.children.map(function(x){return fin(x)})};
  }
  var kids=rootV.children;
  if(!kids.length)return null;
  if(kids.length===1&&kids[0].h===1)return fin(kids[0]);
  return {content:esc(title||'Sơ đồ tư duy'),children:kids.map(function(x){return fin(x)})};
}

/* ---------- Ôn lý thuyết: thư viện ghi chú, đọc, soạn ---------- */
var NKEY='quiz_notes_v1',NPOS='quiz_notes_pos_v1';
var N={docs:[],folders:[],cur:null,noneOpen:true},NU={edit:false,heads:[],raf:0,posT:0,editT:0,pos:{},suppressSpy:0};
var MD_SAMPLE_NAME='Mẫu cú pháp Markdown.md';
var MD_SAMPLE="# Mẫu cú pháp Markdown\n\nĐây là bản mẫu để xem các kiểu định dạng đang được hỗ trợ. Khi không cần nữa, bấm biểu tượng thùng rác cạnh tên tài liệu trong danh sách để xóa.\n\n## Chữ và nhấn mạnh\n\nChữ có thể **in đậm**, *in nghiêng*, ~~gạch ngang~~ hoặc ==đánh dấu nổi bật== để nhớ ý chính. Dùng `mã nội dòng` cho tên hàm, câu lệnh hay công thức ngắn.\n\nMỗi lần xuống dòng sẽ được giữ nguyên,\nnên bạn viết ghi chú ngắn từng dòng vẫn đọc đúng như đã gõ.\n\n## Danh sách\n\n- Gạch đầu dòng\n  - Mục con thụt vào hai khoảng trắng\n  - Mục con khác\n- Mục cùng cấp\n\n1. Bước thứ nhất\n2. Bước thứ hai\n3. Bước thứ ba\n\nDanh sách việc cần ôn:\n\n- [x] Đã ôn chương 1\n- [ ] Chưa ôn chương 2\n\n## Mã nguồn\n\nĐặt tên ngôn ngữ sau ba dấu huyền để mã được tô sáng và có nút chép:\n\n```python\ndef binary_search(a, x):\n    lo, hi = 0, len(a) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2  # chỉ số giữa\n        if a[mid] == x:\n            return mid\n        elif a[mid] < x:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n```\n\n```sql\nSELECT name, score FROM students WHERE score >= 8 ORDER BY score DESC;\n```\n\n## Bảng\n\n| Thuật toán | Trung bình | Xấu nhất |\n|:--|:-:|:-:|\n| Tìm kiếm tuần tự | O(n) | O(n) |\n| Tìm kiếm nhị phân | O(log n) | O(log n) |\n\n## Khung ghi chú\n\n> [!NOTE]\n> Dùng cho định nghĩa hoặc ý bổ sung.\n\n> [!TIP]\n> Viết mỗi ý một dòng sẽ dễ ôn lại hơn.\n\n> [!IMPORTANT]\n> Phần phải nhớ khi đi thi.\n\n> [!WARNING]\n> Lỗi hay nhầm: tìm kiếm nhị phân chỉ đúng khi mảng đã được sắp xếp.\n\n> Trích dẫn thông thường, dùng cho phát biểu cần nhớ nguyên văn.\n\n## Liên kết và ảnh\n\nLiên kết: [Hướng dẫn Markdown](https://commonmark.org/help/). Dán thẳng địa chỉ như https://commonmark.org cũng tự thành liên kết.\n\nẢnh dùng cú pháp `![mô tả](địa chỉ ảnh)`, ảnh phải có địa chỉ http(s) hoặc dạng data:image.\n\n---\n\nMục lục bên trái được tạo từ các dòng bắt đầu bằng `#`, `##`, `###`.\n";

function nStatus(msg,bad){var el=$('#nSaved');if(el){el.textContent=msg;el.classList.toggle('error-text',!!bad)}}
function nCur(){
  var d=N.docs.filter(function(x){return x.id===N.cur})[0];
  if(!d&&N.docs.length){d=N.docs[0];N.cur=d.id}
  return d||null;
}
function nTitle(d){
  var ls=d.text.split('\n',400),fence=false;
  for(var i=0;i<ls.length;i++){
    var l=ls[i];
    if(/^ {0,3}(```|~~~)/.test(l)){fence=!fence;continue}
    if(fence)continue;
    var m=l.match(/^ {0,3}#\s+(.+?)(?:\s+#+)?\s*$/);
    if(m)return m[1].replace(/[*_`~=]/g,'').trim()||d.name;
  }
  return d.name||'Ghi chú';
}
/* ---------- Thư mục theo môn học ---------- */
function nLoad(){
  try{
    var o=JSON.parse(localStorage.getItem(NKEY)||'null');
    if(o&&Array.isArray(o.docs)){
      var seen={};
      N.folders=(Array.isArray(o.folders)?o.folders:[]).filter(function(f){
        return f&&typeof f.id==='string'&&typeof f.name==='string'&&f.name.trim()&&!seen[f.id]&&(seen[f.id]=1);
      }).map(function(f){return {id:f.id,name:f.name.trim().slice(0,60),open:f.open!==false}});
      N.noneOpen=o.noneOpen!==false;
      N.docs=o.docs.filter(function(d){return d&&typeof d.id==='string'&&typeof d.text==='string'}).map(function(d){
        var r={id:d.id,name:String(d.name||'Ghi chú'),text:d.text};
        if(typeof d.folder==='string'&&seen[d.folder])r.folder=d.folder;
        return r;
      });
      N.cur=o.cur;
    }
  }catch(e){}
  try{NU.pos=JSON.parse(localStorage.getItem(NPOS)||'{}')||{}}catch(e){NU.pos={}}
}
function nSave(){
  try{localStorage.setItem(NKEY,JSON.stringify({v:2,cur:N.cur,docs:N.docs,folders:N.folders,noneOpen:N.noneOpen}));nStatus('Đã lưu trong trình duyệt');return true}
  catch(e){nStatus('Không lưu được: bộ nhớ trình duyệt đã đầy hoặc bị chặn. Hãy bấm Tải .md để giữ bản sao.',true);return false}
}
function nFolderById(id){return id?(N.folders.filter(function(f){return f.id===id})[0]||null):null}
function nFolderByName(name){var k=String(name).trim().toLowerCase();return N.folders.filter(function(f){return f.name.toLowerCase()===k})[0]||null}
function nFolderAdd(name){
  var f={id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:String(name).trim().slice(0,60),open:true};
  N.folders.push(f);return f;
}
function nFolderEnsure(name){return (nFolderByName(name)||nFolderAdd(name)).id}
function nFolderOpen(fid){var f=nFolderById(fid);if(f)f.open=true;else if(!fid)N.noneOpen=true}
/* thư mục đang chọn: nơi file mới, ghi chú mới được thêm vào (null = chưa phân loại) */
function nActive(){
  if(NU.folder!==undefined&&(NU.folder===null||nFolderById(NU.folder)))return NU.folder;
  var d=nCur();return d&&nFolderById(d.folder)?d.folder:null;
}
function nAdd(name,text,folder){
  var d={id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name,text:text};
  if(nFolderById(folder))d.folder=folder;
  N.docs.push(d);N.cur=d.id;return d;
}

/* ---------- Danh sách tài liệu theo thư mục ---------- */
function nDocRow(d,t){
  var on=d.id===N.cur;
  return '<div class="doc'+(on?' on':'')+'" role="listitem"><button type="button" class="doc-open" data-doc="'+d.id+'"'+(on?' aria-current="true"':'')+'><i class="ph ph-file-text" aria-hidden="true"></i><span>'+esc(t)+'</span></button>'+
    '<button type="button" class="doc-mv" data-move="'+d.id+'" title="Chuyển vào thư mục" aria-label="Chuyển tài liệu '+esc(t)+' vào thư mục"><i class="ph ph-folder-simple" aria-hidden="true"></i></button>'+
    '<button type="button" class="doc-del" data-del="'+d.id+'" title="Xóa tài liệu" aria-label="Xóa tài liệu '+esc(t)+'"><i class="ph ph-trash" aria-hidden="true"></i></button></div>';
}
function nFolderHTML(f,title,rows,open,active){
  var fid=f?f.id:'';
  return '<section class="fld'+(open?' open':'')+(active?' on':'')+'" data-fid="'+fid+'">'+
    '<div class="fld-h"><button type="button" class="fld-toggle" data-ftoggle="'+fid+'" aria-expanded="'+open+'"><i class="ph ph-caret-right caret" aria-hidden="true"></i><i class="ph '+(open?'ph-folder-open':'ph-folder')+'" aria-hidden="true"></i><span class="fld-name">'+esc(title)+'</span><span class="fld-n">'+rows.length+'</span></button>'+
    (f?'<button type="button" class="fld-menu" data-fmenu="'+fid+'" title="Tùy chọn thư mục" aria-label="Tùy chọn thư mục '+esc(title)+'"><i class="ph ph-dots-three" aria-hidden="true"></i></button>':'')+'</div>'+
    '<div class="fld-body" role="list">'+(rows.length?rows.join(''):'<p class="hint fld-empty">Thư mục trống.</p>')+'</div></section>';
}
function nTreeHTML(){
  var groups={},none=[];
  N.docs.forEach(function(d){
    var item={d:d,t:nTitle(d)};
    if(nFolderById(d.folder))(groups[d.folder]=groups[d.folder]||[]).push(item);else none.push(item);
  });
  function rows(a){
    return a.sort(function(x,y){return x.t.localeCompare(y.t,'vi',{numeric:true,sensitivity:'base'})}).map(function(i){return nDocRow(i.d,i.t)});
  }
  if(!N.folders.length){
    return none.length?'<div class="doclist" role="list">'+rows(none).join('')+'</div>':'<p class="hint">Chưa có tài liệu nào.</p>';
  }
  var act=nActive(),h='';
  N.folders.forEach(function(f){h+=nFolderHTML(f,f.name,rows(groups[f.id]||[]),f.open!==false,act===f.id)});
  if(none.length)h+=nFolderHTML(null,'Chưa phân loại',rows(none),N.noneOpen!==false,act===null);
  return '<div class="foldertree">'+h+'</div>';
}
function nDrawSide(){
  var old=$('#side .doctree'),st=old?old.scrollTop:0;
  var act=nActive(),af=nFolderById(act);
  $('#side').innerHTML='<div class="side-h"><strong>Tài liệu</strong><button class="btn x" id="closeNav">Đóng</button></div>'+
    '<div class="doctree">'+nTreeHTML()+'</div>'+
    '<div class="doc-actions"><button class="btn" id="nOpen"><i class="ph ph-file-arrow-up" aria-hidden="true"></i> Mở file .md</button><button class="btn" id="nNew"><i class="ph ph-note-pencil" aria-hidden="true"></i> Ghi chú mới</button>'+
      '<button class="btn" id="nFolderNew"><i class="ph ph-folder-plus" aria-hidden="true"></i> Thư mục mới</button><button class="btn" id="nOpenDir" title="Chọn cả một thư mục trên máy, mỗi thư mục con thành một thư mục môn học"><i class="ph ph-folder-open" aria-hidden="true"></i> Mở thư mục</button></div>'+
    (N.folders.length?'<p class="target-hint">Thêm vào: <b>'+esc(af?af.name:'Chưa phân loại')+'</b></p>':'')+
    '<div class="toc-h">Mục lục</div><nav class="toc" id="toc" aria-label="Mục lục">'+nTocHTML()+'</nav>';
  var nu=$('#side .doctree');if(nu)nu.scrollTop=st;
}

/* ---------- Hộp thoại nhập tên ---------- */
function nAsk(title,placeholder,value,okText,onOk){
  openModal('<h3>'+title+'</h3><input type="text" id="askIn" class="txt-in" maxlength="60" autocomplete="off" spellcheck="false" placeholder="'+esc(placeholder)+'" value="'+esc(value)+'" aria-label="'+esc(title)+'">'+
    '<p class="ask-err" id="askErr" role="alert"></p><div class="btns"><button class="btn" id="askNo">Hủy</button><button class="btn primary" id="askOk">'+okText+'</button></div>');
  var inp=$('#askIn');inp.focus();inp.select();
  function submit(){var v=inp.value.trim();if(!v){nAskErr('Hãy nhập tên.');return}onOk(v.slice(0,60))}
  $('#askNo').onclick=closeModal;$('#askOk').onclick=submit;
  inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();submit()}};
}
function nAskErr(msg){var e=$('#askErr');if(e)e.textContent=msg}

/* ---------- Thao tác thư mục ---------- */
function nFolderNew(then){
  nAsk('Thư mục mới','Ví dụ: Mạng máy tính','','Tạo',function(name){
    if(nFolderByName(name)){nAskErr('Đã có thư mục tên này.');return}
    var f=nFolderAdd(name);closeModal();
    if(then){then(f);return}
    NU.folder=f.id;nSave();nDrawSide();
  });
}
function nFolderRename(fid){
  var f=nFolderById(fid);if(!f)return;
  nAsk('Đổi tên thư mục','Tên thư mục',f.name,'Lưu',function(name){
    var ex=nFolderByName(name);
    if(ex&&ex.id!==fid){nAskErr('Đã có thư mục tên này.');return}
    f.name=name;closeModal();nSave();nDrawSide();
  });
}
function nFolderMenu(fid){
  var f=nFolderById(fid);if(!f)return;
  openModal('<h3>'+esc(f.name)+'</h3><div class="menu-list">'+
    '<button type="button" class="btn" id="fmNew"><i class="ph ph-note-pencil" aria-hidden="true"></i> Ghi chú mới trong thư mục</button>'+
    '<button type="button" class="btn" id="fmAdd"><i class="ph ph-file-arrow-up" aria-hidden="true"></i> Thêm file .md vào thư mục</button>'+
    '<button type="button" class="btn" id="fmRen"><i class="ph ph-pencil-simple" aria-hidden="true"></i> Đổi tên</button>'+
    '<button type="button" class="btn" id="fmDel"><i class="ph ph-trash" aria-hidden="true"></i> Xóa thư mục</button></div>'+
    '<div class="btns"><button class="btn" id="fmNo">Đóng</button></div>');
  $('#fmNo').onclick=closeModal;
  $('#fmNew').onclick=function(){closeModal();nNew(fid)};
  $('#fmAdd').onclick=function(){closeModal();NU.importTarget=fid;$('#nFile').click()};
  $('#fmRen').onclick=function(){closeModal();nFolderRename(fid)};
  $('#fmDel').onclick=function(){closeModal();nFolderDelete(fid)};
}
function nFolderDelete(fid){
  var f=nFolderById(fid);if(!f)return;
  var n=N.docs.filter(function(d){return d.folder===fid}).length;
  function remove(withDocs){
    closeModal();
    N.docs=N.docs.filter(function(d){
      if(d.folder!==fid)return true;
      if(withDocs){delete NU.pos[d.id];return false}
      delete d.folder;return true;
    });
    N.folders=N.folders.filter(function(x){return x.id!==fid});
    if(NU.folder===fid)NU.folder=null;
    if(!N.docs.some(function(d){return d.id===N.cur}))N.cur=N.docs.length?N.docs[0].id:null;
    NU.edit=false;nSave();showNotes();
  }
  if(!n){
    openModal('<h3>Xóa thư mục “'+esc(f.name)+'”?</h3><p>Thư mục này đang trống.</p><div class="btns"><button class="btn" id="fdNo">Giữ lại</button><button class="btn primary" id="fdKeep">Xóa thư mục</button></div>');
    $('#fdNo').onclick=closeModal;$('#fdKeep').onclick=function(){remove(false)};return;
  }
  openModal('<h3>Xóa thư mục “'+esc(f.name)+'”?</h3><p>Thư mục có <b>'+n+'</b> tài liệu. File .md gốc trên máy của bạn, nếu có, không bị ảnh hưởng.</p>'+
    '<div class="btns"><button class="btn" id="fdNo">Hủy</button><button class="btn" id="fdAll">Xóa cả '+n+' tài liệu</button><button class="btn primary" id="fdKeep">Chỉ xóa thư mục</button></div>'+
    '<p class="hint" style="margin-top:12px">“Chỉ xóa thư mục” giữ lại các tài liệu trong mục Chưa phân loại.</p>');
  $('#fdNo').onclick=closeModal;$('#fdAll').onclick=function(){remove(true)};$('#fdKeep').onclick=function(){remove(false)};
}
function nMoveDoc(id){
  var d=N.docs.filter(function(x){return x.id===id})[0];if(!d)return;
  var cur=nFolderById(d.folder)?d.folder:'';
  var items=[{id:'',name:'Chưa phân loại'}].concat(N.folders);
  openModal('<h3>Chuyển vào thư mục</h3><p class="hint">'+esc(nTitle(d))+'</p><div class="menu-list">'+
    items.map(function(f){
      return '<button type="button" class="btn'+(f.id===cur?' on':'')+'" data-to="'+f.id+'"'+(f.id===cur?' aria-current="true"':'')+'><i class="ph '+(f.id===cur?'ph-check':'ph-folder')+'" aria-hidden="true"></i> '+esc(f.name)+'</button>';
    }).join('')+
    '<button type="button" class="btn" data-to="__new"><i class="ph ph-folder-plus" aria-hidden="true"></i> Thư mục mới…</button></div>'+
    '<div class="btns"><button class="btn" id="mvNo">Hủy</button></div>');
  $('#mvNo').onclick=closeModal;
  function put(fid){
    closeModal();
    if(fid)d.folder=fid;else delete d.folder;
    if(d.id===N.cur)NU.folder=fid||null;
    nFolderOpen(fid);nSave();nDrawSide();
  }
  Array.prototype.forEach.call(document.querySelectorAll('#modal [data-to]'),function(b){
    b.onclick=function(){
      var to=b.dataset.to;
      if(to==='__new'){closeModal();nFolderNew(function(f){put(f.id)});return}
      put(to);
    };
  });
}

/* ---------- Mở file / thư mục vào đúng thư mục ---------- */
function nSwitch(id){
  nPosSave();N.cur=id;
  var d=nCur();NU.folder=d&&nFolderById(d.folder)?d.folder:null;nFolderOpen(NU.folder);
  NU.edit=false;nSave();showNotes();
}
function nNew(fid){
  nPosSave();
  var f=fid!==undefined?fid:nActive();
  nAdd('Ghi chú mới','# Ghi chú mới\n\n',f);
  NU.edit=true;NU.folder=nFolderById(f)?f:null;nFolderOpen(NU.folder);nSave();showNotes();
  var ta=$('#nText');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}
}
/* Chọn cả thư mục: nếu có thư mục con thì mỗi thư mục con là một thư mục môn học (bỏ tên thư mục gốc);
   nếu chỉ có file trực tiếp thì thư mục gốc chính là thư mục môn học. */
function nPathFolder(f,deep){
  var p=f.webkitRelativePath||'';if(p.indexOf('/')<0)return '';
  var dirs=p.split('/').slice(0,-1);
  return (deep&&dirs.length>1?dirs.slice(1):dirs.slice(0,1)).join(' / ').slice(0,60);
}
function nImport(files){
  var base=NU.importTarget!==undefined?NU.importTarget:nActive();NU.importTarget=undefined;
  var list=Array.prototype.filter.call(files,function(f){
    var p=f.webkitRelativePath||'';
    if(/(^|\/)(\.[^\/]*|node_modules)(\/|$)/.test(p))return false;
    return /\.(md|markdown|txt)$/i.test(f.name)||/^text\//.test(f.type);
  });
  if(!list.length){progAlert('Không đọc được file','Hãy chọn file có đuôi .md, .markdown hoặc .txt.');return}
  var deep=list.some(function(f){return (f.webkitRelativePath||'').split('/').length>2});
  var res=new Array(list.length),left=list.length;
  function fin(){
    if(--left)return;
    var added=0,same=0,newFolders=0,last=null;
    res.forEach(function(x){
      if(!x)return;
      var fid=base;
      if(x.folder){if(!nFolderByName(x.folder))newFolders++;fid=nFolderEnsure(x.folder)}
      var ex=N.docs.filter(function(d){return (nFolderById(d.folder)?d.folder:null)===(fid||null)&&d.name===x.name&&d.text===x.text})[0];
      if(ex){same++;last=ex}else{last=nAdd(x.name,x.text,fid);added++}
    });
    if(!last){progAlert('Không đọc được file','Không đọc được file đã chọn.');return}
    nPosSave();N.cur=last.id;NU.edit=false;NU.folder=nFolderById(last.folder)?last.folder:null;nFolderOpen(NU.folder);
    nSave();showNotes();
    if(list.length>1||same){
      progAlert('Đã nhập file','Đã thêm <b>'+added+'</b> tài liệu'+(newFolders?', tạo <b>'+newFolders+'</b> thư mục mới':'')+(same?'. <b>'+same+'</b> file đã có sẵn nên được bỏ qua':'')+'.');
    }
  }
  list.forEach(function(f,k){
    var r=new FileReader();
    r.onload=function(){res[k]={name:f.name,folder:nPathFolder(f,deep),text:String(r.result||'').replace(/^\uFEFF/,'')};fin()};
    r.onerror=function(){res[k]=null;fin()};
    r.readAsText(f,'UTF-8');
  });
}

/* thanh chuyển giữa ôn lý thuyết và làm trắc nghiệm */
function modeSwitch(active){
  function b(k,icon,label){return '<button type="button" role="tab" data-sw="'+k+'" aria-selected="'+(active===k)+'"><i class="ph '+icon+'" aria-hidden="true"></i><span>'+label+'</span></button>'}
  return '<div class="modeswitch" role="tablist" aria-label="Chế độ học">'+b('notes','ph-book-open-text','Ôn lý thuyết')+b('quiz','ph-list-checks','Làm trắc nghiệm')+'</div>';
}
function bindSwitch(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-sw]'),function(b){
    b.onclick=function(){
      var inNotes=document.body.dataset.view==='notes';
      if(b.dataset.sw==='notes'){if(!inNotes)showNotes()}
      else if(document.body.dataset.view!=='start'){nPosSave();showStart()}
    };
  });
}

function nPosSave(){
  var d=nCur();
  if(!d||NU.edit||document.body.dataset.view!=='notes')return;
  NU.pos[d.id]=Math.round(window.scrollY);
  try{localStorage.setItem(NPOS,JSON.stringify(NU.pos))}catch(e){}
}
function nOnScroll(){
  if(document.body.dataset.view!=='notes'||NU.raf||NU.suppressSpy)return;
  /* Theo dõi mục lục cả khi đọc và khi xem trước trong chế độ soạn.
     Không đọc vị trí của bản xem trước khi nó đang bị ẩn ở tab Viết/Mind map. */

/* ---------- Tải Markmap khi cần: d3 + markmap-view (không còn markmap-lib) ---------- */
var MM_D3='https://cdn.jsdelivr.net/npm/d3@7.9.0',MM_VIEW='https://cdn.jsdelivr.net/npm/markmap-view@0.18.12',MM_LOADING=null;
function nHasMarkmap(){return !!(window.d3&&window.markmap&&window.markmap.Markmap)}
function nLoadScript(src){
  return new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src=src;s.onload=function(){resolve()};
    s.onerror=function(){s.remove();reject(new Error('Không tải được '+src))};
    document.head.appendChild(s);
  });
}
function nLoadMarkmap(){
  if(nHasMarkmap())return Promise.resolve();
  if(!MM_LOADING)MM_LOADING=nLoadScript(MM_D3).then(function(){return nLoadScript(MM_VIEW)}).then(function(){
    MM_LOADING=null;
    if(!nHasMarkmap())throw new Error('Thư viện đã tải nhưng thiếu markmap');
  }).catch(function(err){MM_LOADING=null;throw err});
  return MM_LOADING;
}
function nRenderMap(svgSelector,wrapSelector){
  /* Dùng chung hàm vẽ cho bản soạn thảo và chế độ đọc. */
  svgSelector=svgSelector||'#nMap';wrapSelector=wrapSelector||'#nMapWrap';
  var svg=$(svgSelector),ta=$('#nText'),doc=nCur();if(!svg)return;
  var wrap=$(wrapSelector),hint=wrap&&(wrap.parentElement?wrap.parentElement.querySelector('.ned-map-hint'):null);
  function say(t){if(hint)hint.textContent=t}
  function clearMap(){
    var old=svg._markmapInstance;
    if(old&&typeof old.destroy==='function'){try{old.destroy()}catch(ignore){}}
    svg._markmapInstance=null;svg.innerHTML='';
  }
  var source=(ta?ta.value:(doc?doc.text:'')).trim();
  if(!source){clearMap();say('Tài liệu đang trống. Thêm tiêu đề hoặc danh sách Markdown để tạo sơ đồ.');return}
  var root=null;
  try{root=mdOutline(source,doc?nTitle(doc):'')}catch(err){root=null}
  if(!root||!root.children.length){clearMap();say('Chưa có gì để vẽ. Sơ đồ lấy từ tiêu đề (#, ##, ###) và danh sách (-); đoạn văn không lên sơ đồ.');return}
  if(!nHasMarkmap()){
    /* Lần đầu mở Mind map: tải thư viện rồi vẽ lại một lần với nội dung mới nhất. */
    var waiting=!!NU.mmPending;
    NU.mmPending={svg:svgSelector,wrap:wrapSelector};
    say('Đang tải thư viện sơ đồ…');
    if(waiting)return;
    nLoadMarkmap().then(function(){
      var p=NU.mmPending;NU.mmPending=null;
      if(p&&$(p.svg))nRenderMap(p.svg,p.wrap);
    },function(){
      NU.mmPending=null;
      say('Không tải được Markmap. Kiểm tra kết nối Internet rồi mở lại Mind map.');
    });
    return;
  }
  say('Bấm vào sơ đồ để chọn · ← ↑ → ↓ di chuyển · + / − thu phóng · 0 vừa khung');
  try{
    clearMap();
    var instance=window.markmap.Markmap.create(svg,{autoFit:true,duration:250,zoom:true,pan:true},root);
    svg._markmapInstance=instance;svg._mapZoom=100;
    if(wrap){var slider=wrap.querySelector('[data-map-zoom]'),value=wrap.querySelector('[data-map-zoom-value]');if(slider)slider.value='100';if(value)value.textContent='100%';}
  }catch(err){
    svg.innerHTML='';
    say('Chưa tạo được sơ đồ. Hãy dùng tiêu đề Markdown (#, ##, ###) và danh sách (-).');
  }
}
function nMapInstance(wrap){
  var svg=wrap&&wrap.querySelector('svg');
  return svg&&svg._markmapInstance?{svg:svg,mm:svg._markmapInstance}:null;
}
function nMapSetZoom(wrap,target){
  var pair=nMapInstance(wrap);if(!pair)return;
  var svg=pair.svg,mm=pair.mm,next=Math.max(30,Math.min(400,Math.round(Number(target)/10)*10));
  var prev=Number(svg._mapZoom||100);
  if(next!==prev&&mm.svg&&mm.zoom){
    var factor=next/prev;
    try{var sel=mm.svg;if(typeof sel.transition==='function')sel.transition().duration(110).call(mm.zoom.scaleBy,factor);else sel.call(mm.zoom.scaleBy,factor);svg._mapZoom=next;}catch(err){return;}
  }
  var slider=wrap.querySelector('[data-map-zoom]'),value=wrap.querySelector('[data-map-zoom-value]');
  if(slider)slider.value=String(next);if(value)value.textContent=next+'%';
}
function nMapAct(wrap,action){
  var pair=nMapInstance(wrap);if(!pair)return;
  var svg=pair.svg,mm=pair.mm;
  if(action==='zoom-in')nMapSetZoom(wrap,Number(svg._mapZoom||100)+10);
  else if(action==='zoom-out')nMapSetZoom(wrap,Number(svg._mapZoom||100)-10);
  else if(action==='fit'){
    if(typeof mm.fit==='function')mm.fit();svg._mapZoom=100;
    var slider=wrap.querySelector('[data-map-zoom]'),value=wrap.querySelector('[data-map-zoom-value]');if(slider)slider.value='100';if(value)value.textContent='100%';
  }else if(action==='left'||action==='right'||action==='up'||action==='down'){
    /* Arrow keys describe the direction the map content should move on screen.
       D3's transform translation feels inverted for this interaction, so invert
       the translation signs: Left moves the map left; Up moves it up. */
    if(mm.svg&&mm.zoom){var dx=action==='left'?75:action==='right'?-75:0,dy=action==='up'?75:action==='down'?-75:0;try{mm.svg.transition().duration(100).call(mm.zoom.translateBy,dx,dy)}catch(ignore){}}
  }
}
function nMapBind(){
  var root=$('#nmain');if(!root)return;
  Array.prototype.forEach.call(root.querySelectorAll('.ned-map'),function(wrap){wrap.onpointerdown=function(e){if(e.target&&e.target.closest&&e.target.closest('svg')){try{wrap.focus({preventScroll:true})}catch(ignore){wrap.focus()}}};});
  Array.prototype.forEach.call(root.querySelectorAll('[data-map-zoom]'),function(slider){slider.oninput=function(){nMapSetZoom(slider.closest('.ned-map'),Number(slider.value));};});
}

/* ---------- thao tác ---------- */
function nBind(){
  $('#nFile').onchange=function(e){var f=e.target.files;if(f&&f.length)nImport(f);e.target.value=''};
  $('#nDir').onchange=function(e){var f=e.target.files;if(f&&f.length)nImport(f);e.target.value=''};
  $('#side').onclick=function(e){
    var t=e.target,o=t.closest('[data-doc]');
    if(o){nSwitch(o.dataset.doc);return}
    var x=t.closest('[data-del]');if(x){nAskDelete(x.dataset.del);return}
    var mv=t.closest('[data-move]');if(mv){nMoveDoc(mv.dataset.move);return}
    var fm=t.closest('[data-fmenu]');if(fm){nFolderMenu(fm.dataset.fmenu);return}
    var ft=t.closest('[data-ftoggle]');
    if(ft){
      var fid=ft.dataset.ftoggle,fo=nFolderById(fid);
      if(fo)fo.open=!(fo.open!==false);else N.noneOpen=!(N.noneOpen!==false);
      NU.folder=fo?fid:null;nSave();nDrawSide();return;
    }
    if(t.closest('#nFolderNew')){nFolderNew();return}
    if(t.closest('#nOpenDir')){NU.importTarget=undefined;$('#nDir').click();return}
    var a=t.closest('a[data-h]');if(a){e.preventDefault();nGoHeading(a.dataset.h);return}
    if(t.closest('#nOpen')){NU.importTarget=undefined;$('#nFile').click();return}
    if(t.closest('#nNew')){nNew();return}
    if(t.closest('#closeNav'))document.body.classList.remove('nav-open');
  };
  nMapBind();
  $('#nmain').onclick=function(e){
    var t=e.target,c=t.closest('[data-copy]');
    if(c){nCopy(c);return}
    var mapAction=t.closest('[data-map-action]');if(mapAction){nMapAct(mapAction.closest('.ned-map'),mapAction.dataset.mapAction);return}
    var f=t.closest('[data-fmt]');if(f){nFormat(f.dataset.fmt);return}
    var p=t.closest('.ned-tabs [data-pane]');if(p){nPane(p.dataset.pane);return}
    var rp=t.closest('.nread-tabs [data-readpane]');if(rp){nReadPane(rp.dataset.readpane);return}
    if(t.closest('#nDl')){nDownload();return}
    if(t.closest('#eOpen')){NU.importTarget=undefined;$('#nFile').click();return}
    if(t.closest('#eNew')){nNew();return}
    if(t.closest('#eSample')){nSample();return}
    if(t.closest('#toQuiz')){nPosSave();showStart()}
  };
  $('#nmain').onkeydown=function(e){
    var wrap=e.target&&e.target.closest?e.target.closest('.ned-map'):null;if(!wrap)return;
    if(e.target.closest('button,input,textarea,select'))return;
    var key=e.key,action=null;
    if(key==='ArrowLeft')action='left';else if(key==='ArrowRight')action='right';else if(key==='ArrowUp')action='up';else if(key==='ArrowDown')action='down';
    else if(key==='+'||key==='=')action='zoom-in';else if(key==='-'||key==='_')action='zoom-out';else if(key==='0')action='fit';
    if(action){e.preventDefault();nMapAct(wrap,action)}
  };
  var v=$('#view');
  v.ondragover=function(e){if(document.body.dataset.view!=='notes')return;e.preventDefault();v.classList.add('dropping')};
  v.ondragleave=function(e){if(!e.relatedTarget||!v.contains(e.relatedTarget))v.classList.remove('dropping')};
  v.ondrop=function(e){
    v.classList.remove('dropping');
    if(document.body.dataset.view!=='notes')return;
    e.preventDefault();
    if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){NU.importTarget=undefined;nImport(e.dataTransfer.files)}
  };
}
function nGoHeading(id){
  document.body.classList.remove('nav-open');
  if($('#ned')){
    /* Cập nhật bản xem trước đồng bộ, tránh mục lục/ID bị trễ so với nội dung vừa sửa. */
    nPreview();nPane('preview');
  }else nReadPane('read');
  var el=document.getElementById(id);
  if(!el){
    /* Nếu người dùng vừa đổi tiêu đề và bấm mục lục trước khi debounce hoàn tất,
       dựng lại mục lục rồi thử tìm đúng ID một lần nữa. */
    nDrawSide();el=document.getElementById(id);
  }
  if(!el)return;

  /* Giữ highlight ổn định trong lúc cuộn (tránh scroll-spy nhảy về mục trước). */
  NU.suppressSpy = Date.now() + 800;
  nSetTocActive(id);

  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});

  /* Sau khi cuộn xong, ép lại highlight đúng và mở lại scroll-spy. */
  clearTimeout(NU._spyT);
  NU._spyT = setTimeout(function(){
    nSetTocActive(id);
    NU.suppressSpy = 0;
  }, reduce ? 50 : 700);
}
function nSample(){
  var ex=N.docs.filter(function(d){return d.name===MD_SAMPLE_NAME})[0];
  if(ex)N.cur=ex.id;else nAdd(MD_SAMPLE_NAME,MD_SAMPLE);
  NU.edit=false;nSave();showNotes();
}
function nAskDelete(id){
  var d=N.docs.filter(function(x){return x.id===id})[0];if(!d)return;
  openModal('<h3>Xóa tài liệu này?</h3><p><b>'+esc(nTitle(d))+'</b> sẽ bị xóa khỏi trình duyệt này. File .md gốc trên máy của bạn, nếu có, không bị ảnh hưởng.</p><div class="btns"><button class="btn" id="dno">Giữ lại</button><button class="btn primary" id="dyes">Xóa</button></div>');
  $('#dno').onclick=closeModal;
  $('#dyes').onclick=function(){
    closeModal();
    N.docs=N.docs.filter(function(x){return x.id!==id});
    delete NU.pos[id];
    if(N.cur===id)N.cur=N.docs.length?N.docs[0].id:null;
    NU.edit=false;nSave();showNotes();
  };
}
function nDownload(){
  var d=nCur();if(!d)return;
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([d.text],{type:'text/markdown;charset=utf-8'}));
  a.download=(d.name||'ghi-chu').replace(/\.[^.]+$/,'')+'.md';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
}
function nCopy(btn){
  var pre=btn.closest('.md-code').querySelector('pre'),text=pre.textContent,lab=btn.querySelector('span');
  function done(ok){lab.textContent=ok?'Đã chép':'Không chép được';setTimeout(function(){lab.textContent='Chép'},1400)}
  function fallback(){
    var ta=document.createElement('textarea'),ok=false;
    ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand('copy')}catch(e){}
    ta.remove();done(ok);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){done(true)},fallback);
  else fallback();
}
function nFormat(kind){
  var ta=$('#nText');if(!ta)return;
  var s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,sel=v.slice(s,e),rep='',a=s,b=e;
  function wrap(l,r,ph){var t=sel||ph;rep=l+t+r;a=s+l.length;b=a+t.length}
  function line(prefix,ph){
    var ls=v.lastIndexOf('\n',s-1)+1,le=v.indexOf('\n',e);if(le<0)le=v.length;
    var out=(v.slice(ls,le)||ph).split('\n').map(function(x){return prefix+x}).join('\n');
    s=ls;e=le;rep=out;a=s+prefix.length;b=s+out.length;
  }
  if(kind==='bold')wrap('**','**','in đậm');
  else if(kind==='italic')wrap('*','*','in nghiêng');
  else if(kind==='mark')wrap('==','==','nổi bật');
  else if(kind==='code')wrap('`','`','mã');
  else if(kind==='block')wrap((s>0&&v.charAt(s-1)!=='\n'?'\n':'')+'```\n','\n```\n','mã nguồn');
  else if(kind==='h')line('## ','Tiêu đề');
  else if(kind==='ul')line('- ','Mục');
  else if(kind==='quote')line('> ','Trích dẫn');
  else return;
  ta.focus();ta.setRangeText(rep,s,e,'end');ta.setSelectionRange(a,b);
  ta.dispatchEvent(new Event('input'));
}


nLoad();
loadPrefs();
loadPack();
S=load();
showStart();
})();
